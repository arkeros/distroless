name: Update Debian Packages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
concurrency:
  group: update-debian-packages
  cancel-in-progress: false
jobs:
  update:
    name: Update Debian packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for the remote cache's workload identity federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Bazel's remote cache is a GCS bucket read through workload identity
      # federation; see //infra. Must precede setup-bazel's first invocation.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
          service_account: github-actions-cache@senku-prod.iam.gserviceaccount.com
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Shares a single Actions cache entry with every other workflow —
          # the key is platform + a hash of MODULE.bazel, with no workflow
          # component. See release-cli.yaml. `external-cache` is deliberately
          # left off: that one is keyed per workflow/job.
          repository-cache: true
          bazelrc: |
            common --config=ci
            common --config=gcs
      - name: Install knife
        uses: ./.github/actions/setup-knife
        with:
          target: //bazel/cmd/knife
      - name: Update Debian packages
        uses: ./.github/actions/update-debian-packages
        with:
          manifests: >-
            images/debian.yaml
            images/nginx/nginx-stable.yaml
            images/nginx/nginx-mainline.yaml
          token: ${{ secrets.RENOVATE_TOKEN }}
