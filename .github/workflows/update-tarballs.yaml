name: Update Tarballs
on:
  workflow_dispatch:
  schedule:
    # Node and Temurin both cut security releases on their own calendars;
    # a daily check keeps the lag under a day. Offset from the Grype DB
    # job at 06:00 so the two PRs don't race on MODULE.bazel.lock.
    - cron: "0 7 * * *"
concurrency:
  group: update-tarballs
  cancel-in-progress: false
jobs:
  update:
    name: Update ${{ matrix.image }} tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for the remote cache's workload identity federation
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nodejs
            lockfile: images/nodejs/nodejs.lock.json
          - image: java
            lockfile: images/java/temurin.lock.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Bazel's remote cache is a GCS bucket read through workload identity
      # federation; see //infra. Must precede setup-bazel's first invocation.
      # The read-only identity: this workflow may be dispatched from any
      # branch, and only `main` may write the cache (ADR 0014).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
          service_account: github-actions-cache-ro@senku-prod.iam.gserviceaccount.com
      # gRPC cache proxy on this runner, read-only through the viewer identity
      # above: it serves action results and external archives from the bucket
      # and cannot store new ones. An archive only this job needs and `main`
      # never fetched is downloaded from upstream each run; the pinned
      # versions here are the ones `main` builds, so that is rare.
      - name: Set up bazel-remote
        uses: ./.github/actions/setup-bazel-remote
        with:
          bucket: senku-prod-bazel-cache
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # No repository cache: downloads come from the bucket through the
          # proxy. The external cache keeps extracted repositories between
          # runs of this job.
          repository-cache: false
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=bazel-remote-readonly
      - name: Install knife
        uses: ./.github/actions/setup-knife
        with:
          target: //bazel/cmd/knife
      - name: Update tarballs
        uses: ./.github/actions/update-tarballs
        with:
          lockfile: ${{ matrix.lockfile }}
          image: ${{ matrix.image }}
          token: ${{ secrets.RENOVATE_TOKEN }}
