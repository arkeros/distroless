# Cloud Run service definition for the directory site, applied with
# `gcloud run services replace` by the `deploy-web` job in
# `.github/workflows/ci.yaml`.
#
# Shares the external HTTPS load balancer with the registry: the URL map sends
# `/v2/*` to `registry` and everything else here, so `distroless.io` is one
# hostname serving both the OCI pull API and the pages describing what it
# serves. The URL map is NOT managed in this repo — see //infra/README.md.
#
# `image` is a placeholder: the deploy job substitutes the digest-pinned URI of
# the image it just pushed. Never commit a resolved digest here — the manifest
# describes the shape of the service, the pipeline supplies the contents.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web
  labels:
    app: web
  annotations:
    # Same reasoning as the registry: org policy on senku-prod forbids `all`,
    # and this sits behind the shared LB. The `allUsers` invoker binding in
    # //infra is still required because the Serverless NEG calls without an
    # OIDC identity; this annotation is what keeps the service off the open
    # internet.
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: svc-web@senku-prod.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          args:
            - --upstream=ghcr.io
            - --repository-prefix=arkeros/distroless
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # `/healthz` deliberately does not touch GHCR. A probe that depended
          # on the upstream registry would recycle healthy instances whenever
          # ghcr.io was slow.
          startupProbe:
            httpGet:
              path: /healthz
          livenessProbe:
            httpGet:
              path: /healthz
  traffic:
    - percent: 100
      latestRevision: true
