name: Update Tarballs
on:
  workflow_dispatch:
  schedule:
    # Node and Temurin both cut security releases on their own calendars;
    # a daily check keeps the lag under a day. Offset from the Grype DB
    # job at 06:00 so the two PRs don't race on MODULE.bazel.lock.
    - cron: '0 7 * * *'
concurrency:
  group: update-tarballs
  cancel-in-progress: false
jobs:
  update:
    name: Update ${{ matrix.image }} tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nodejs
            lockfile: images/nodejs/nodejs.lock.json
          - image: java
            lockfile: images/java/temurin.lock.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: true
          external-cache: true
          # Restore only, like pr.yaml. This job exists to rewrite
          # MODULE.bazel.lock, and setup-bazel keys its caches on that
          # content — so every successful run would mint a *new* ~6 GB
          # repository entry rather than replace the old one. Two of those
          # exceed the repository's 10 GB Actions cache budget and evict
          # whatever ci.yaml warmed, which since the remote cache was
          # removed is the only cache there is.
          cache-save: false
          bazelrc: |
            common --config=ci
      # The published release, not a source build: knife pulls ~300 external
      # repos (anchore/syft, the AWS SDK, the LLVM toolchain), and
      # release-cli.yaml publishes one on every push to `main` that changes
      # it. `version` unset resolves the latest `knife/*` tag. Bazel above
      # stays: knife shells out to `bazel mod tidy` (bazel/mod/mod.go).
      - name: Install knife
        uses: ./.github/actions/setup-knife
      - name: Update tarballs
        uses: ./.github/actions/update-tarballs
        with:
          lockfile: ${{ matrix.lockfile }}
          image: ${{ matrix.image }}
          token: ${{ secrets.RENOVATE_TOKEN }}
