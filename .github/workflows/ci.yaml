---
# Push to `main`, and only that. Pull requests run pr.yaml, which can only read.
#
# Every job here that touches Bazel declares `environment: prod`. The
# environment's deployment branch policy names `main` and GitHub checks it
# before minting the OIDC token, so the cache-write and deploy identities are
# unreachable from any other ref regardless of what this file says (ADR 0014,
# infra/cache.tf).
#
# The mirror publishes in four steps — publish, provenance, verify, release —
# because provenance is written by the build platform rather than by us, tags
# must not move until every artifact on a digest has been proven, and the job
# that does the proving must not be able to mutate the registry.
name: CI
on:
  push:
    branches: [main]

# Both values come from `terraform output` in //infra. The cache account is
# separate from the deploy account in github.tf and deliberately weaker: it can
# read and write one GCS bucket and nothing else, which is why every job here
# can hold it while only `push-gar`/`deploy` hold the deploy identity.
env:
  WIF_PROVIDER: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
  CACHE_SERVICE_ACCOUNT: github-actions-cache@senku-prod.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write   # for the remote cache's workload identity federation
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CACHE_SERVICE_ACCOUNT }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=gcs

      - name: Test
        run: bazel test //...

  # ---------------------------------------------------------------------------
  # Mirror publish.
  #
  # `publish` pushes every mirror image *by digest* — no tag names it yet —
  # then signs it and attests its SBOM, both under this workflow's identity.
  # It then asks the registry which of those digests already carry platform
  # provenance and hands the rest to `provenance` as a matrix.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish mirror images
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write   # for cosign keyless OIDC (Fulcio + Rekor) and the cache
      packages: write   # for GHCR push + cosign sig/attest artifacts
    outputs:
      # JSON list of `{target, ref}` for everything pushed: the mirror_push
      # base label, and `<registry>/<repository>@<digest>`. `verify` checks
      # the refs and `release` tags the targets, so the two work from one
      # list and the tagged set is the verified set by construction.
      published: ${{ steps.publish.outputs.published }}
      # JSON list of `{image, digest}` for the digests with no provenance yet.
      pending: ${{ steps.publish.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only reaches the Bazel cache bucket; pushing to GHCR below is
      # authenticated separately with GITHUB_TOKEN.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CACHE_SERVICE_ACCOUNT }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=gcs
            build --stamp

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both signers' identity pins come from one Starlark file, //oci:cosign_policy.bzl.
      - name: Load verification policy
        run: |
          set -euxo pipefail
          bazel build //oci:cosign_policy_env
          cat "$(bazel cquery //oci:cosign_policy_env --output=files)" >> "$GITHUB_ENV"

      # All three are Bazel outputs: cosign and slsa-verifier are prebuilt and
      # checksum-pinned in tools/tools.lock.json; the Sigstore trusted root is
      # the pinned file //web embeds, handed to every cosign verify below via
      # --trusted-root so no TUF metadata is fetched at publish time (see
      # //oci:sigstore_trusted_root). cosign is needed here to *verify*, not
      # only to sign: publish decides per digest whether a signature and an
      # SBOM attestation of ours already exist.
      - name: Fetch cosign, slsa-verifier and the Sigstore trusted root
        run: |
          set -euo pipefail
          bazel build --remote_download_outputs=all \
              //bazel/toolchains/cosign:prebuilt_cosign_toolchain \
              @multitool//tools/slsa-verifier \
              //oci:sigstore_trusted_root
          echo "COSIGN=$(realpath "$(bazel cquery //bazel/toolchains/cosign:prebuilt_cosign_toolchain --output=files)")" >> "$GITHUB_ENV"
          echo "SLSA_VERIFIER=$(realpath "$(bazel cquery @multitool//tools/slsa-verifier --output=files)")" >> "$GITHUB_ENV"
          echo "TRUSTED_ROOT=$(realpath "$(bazel cquery //oci:sigstore_trusted_root --output=files)")" >> "$GITHUB_ENV"

      # `mirror_push` macros emit <name>_push, <name>_sign, <name>_attest_sbom
      # and <name>_tag. Discover via `cosign_sign rule`: every mirror image has
      # exactly one. `_tag` is deliberately not run here — see `release`.
      #
      # Every artifact is added at most once per digest. After the push, each
      # of the three is *verified* under the production policy and classified:
      #   verified      → already there from an earlier run; skip.
      #   absent        → add it: run `_sign` / `_attest_sbom`, or hand the
      #                   digest to the `provenance` matrix.
      #   anything else → fail. A Rekor or TUF outage must not read as
      #                   "absent" and be answered with a duplicate
      #                   (ADR 0014: one of each per digest).
      #
      # "Absent" for the two we sign includes "signed, but not by us": a
      # workflow rename heals itself on the next push, and a foreign signature
      # on our digest cannot block a release. Digests are stable across
      # commits when their content is, so a push that changes nothing adds
      # nothing.
      - name: Push, sign, and attest mirror images
        id: publish
        run: |
          set -euo pipefail

          # needs_artifact WHAT REF VERIFIER...: runs VERIFIER; returns 0 when
          # the artifact is present and ours (skip), 1 when it is absent or
          # someone else's (add), and aborts the job on any other failure.
          needs_artifact() {
            local WHAT=$1 REF=$2; shift 2
            local STDERR; STDERR=$(mktemp)
            if "$@" > /dev/null 2> "${STDERR}"; then
              echo "${WHAT} already present: ${REF}"
              return 0
            fi
            # cosign: nothing signed / signed by someone else / no or foreign
            # attestation. slsa-verifier: no provenance. Anything else — DNS,
            # TLS, Rekor, TUF — is not a statement about the registry and is
            # not treated as one. (cosign also says "no signatures found" for
            # a repository that does not exist; harmless here, since the push
            # just above is what creates it, and a sign against a missing
            # digest fails loudly on its own.)
            if grep -qE "no signatures found|no matching signatures|no matching attestations" "${STDERR}"; then
              echo "${WHAT} absent: ${REF}"
              return 1
            fi
            echo "ERROR: could not tell whether ${REF} has a ${WHAT}; refusing to guess." >&2
            cat "${STDERR}" >&2
            exit 1
          }

          SIGN_TARGETS=$(bazel query 'kind("cosign_sign rule", //...)' --output=label)
          : > "${RUNNER_TEMP}/published.jsonl"
          : > "${RUNNER_TEMP}/pending.jsonl"
          for SIGN_TARGET in $SIGN_TARGETS; do
            BASE=${SIGN_TARGET%_sign}
            echo "::group::${BASE}"
            bazel run "${BASE}_push"

            # The digest comes from the build, not from the registry: the push
            # target's deploy manifest names what it pushed, and OCI digests
            # are content addresses, so the two agree by construction.
            bazel build --output_groups=deploy_manifest --remote_download_outputs=all "${BASE}_push"
            MANIFEST=$(bazel cquery "${BASE}_push" --output=files --output_groups=deploy_manifest)
            IMAGE=$(jq -r '.operations[0] | "\(.registry)/\(.repository)"' "$MANIFEST")
            DIGEST=$(jq -r '.operations[0].root.digest' "$MANIFEST")
            REF="${IMAGE}@${DIGEST}"
            jq -c -n --arg target "${BASE}" --arg ref "${REF}" '{$target, $ref}' \
              >> "${RUNNER_TEMP}/published.jsonl"

            if ! needs_artifact signature "${REF}" \
                "${COSIGN}" verify \
                  --trusted-root="${TRUSTED_ROOT}" \
                  --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                  --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                  "${REF}"; then
              bazel run "${BASE}_sign"
            fi

            if bazel query "${BASE}_attest_sbom" 2>/dev/null | grep -q .; then
              if ! needs_artifact "SBOM attestation" "${REF}" \
                  "${COSIGN}" verify-attestation \
                    --trusted-root="${TRUSTED_ROOT}" \
                    --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                    --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                    --type=cyclonedx \
                    "${REF}"; then
                bazel run "${BASE}_attest_sbom"
              fi
            fi

            if ! needs_artifact provenance "${REF}" \
                "${SLSA_VERIFIER}" verify-image "${REF}" \
                  --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
                  --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}"; then
              jq -c -n --arg image "${IMAGE}" --arg digest "${DIGEST}" '{$image, $digest}' \
                >> "${RUNNER_TEMP}/pending.jsonl"
            fi
            echo "::endgroup::"
          done
          {
            echo "published=$(jq -c -s . "${RUNNER_TEMP}/published.jsonl")"
            echo "pending=$(jq -c -s . "${RUNNER_TEMP}/pending.jsonl")"
          } | tee -a "$GITHUB_OUTPUT"

  # The build platform writes provenance, not us: the generator is a reusable
  # workflow that runs in its own VM under its own OIDC identity, after our
  # build has finished and with nothing of ours in reach. That separation is
  # what makes the statement SLSA Build L3 rather than something our own
  # build job could have forged. One call per pending digest.
  #
  # The generator MUST be referenced by a full `vX.Y.Z` tag; it refuses
  # shorter tags and SHA pins. Renovate bumps it but does not auto-merge it
  # (//.github/renovate.json) — this line is the trust root of the L3 claim.
  provenance:
    name: Attest provenance
    needs: publish
    if: needs.publish.outputs.pending != '[]'
    permissions:
      actions: read     # the generator reads the run that called it
      id-token: write   # the generator's own keyless signing
      packages: write   # to attach the attestation to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.pending) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Read-only on purpose. Neither cosign nor slsa-verifier needs a token to
  # verify public artifacts, so the job that holds the policy cannot mutate
  # the registry, and it holds no cloud identity either — the two tools it
  # runs are prebuilt binaries, so it does not need a warm cache.
  #
  # `always()` because `provenance` is skipped when nothing was pending, and
  # a skipped dependency would otherwise skip this too.
  verify:
    name: Verify mirror images
    needs: [publish, provenance]
    if: >-
      always()
      && needs.publish.result == 'success'
      && (needs.provenance.result == 'success' || needs.provenance.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          repository-cache: true
          external-cache: true
          cache-save: false
          bazelrc: |
            common --config=ci

      - name: Load verification policy
        run: |
          set -euxo pipefail
          bazel build //oci:cosign_policy_env
          cat "$(bazel cquery //oci:cosign_policy_env --output=files)" >> "$GITHUB_ENV"

      # The trusted root is the pinned file //web embeds, not a live TUF fetch.
      # Every cosign verify below takes it via --trusted-root, so cosign makes
      # no TUF request in this job at all. (Fetching it live used to be the one
      # network call worth retrying — run 31056638456 died on a CDN 503 for a
      # root file — and it kept CI and the Directory on roots that could drift
      # apart. See //oci:sigstore_trusted_root.) slsa-verifier has no such
      # flag and still refreshes TUF metadata itself.
      - name: Fetch cosign, slsa-verifier and the Sigstore trusted root
        run: |
          set -euo pipefail
          bazel build --remote_download_outputs=all \
              //bazel/toolchains/cosign:prebuilt_cosign_toolchain \
              @multitool//tools/slsa-verifier \
              //oci:sigstore_trusted_root
          echo "COSIGN=$(realpath "$(bazel cquery //bazel/toolchains/cosign:prebuilt_cosign_toolchain --output=files)")" >> "$GITHUB_ENV"
          echo "SLSA_VERIFIER=$(realpath "$(bazel cquery @multitool//tools/slsa-verifier --output=files)")" >> "$GITHUB_ENV"
          echo "TRUSTED_ROOT=$(realpath "$(bazel cquery //oci:sigstore_trusted_root --output=files)")" >> "$GITHUB_ENV"

      # Positive test: every digest `publish` pushed must carry all three
      # artifacts under the production policy — our signature, our SBOM
      # attestation, and platform provenance that names *this* repository as
      # its source. Catches a mis-run attest step, a failed matrix leg that
      # `provenance` reported anyway, signer drift between producer and
      # policy, and provenance minted for the wrong source.
      #
      # An empty list is refused first. Zero verifications passing is not
      # evidence of anything — it is the Silent zero this project's gates
      # exist to catch — and `release` would then tag nothing while this job
      # reported green.
      #
      # The list is read on fd 3, as `push-gar` does: the verifiers inherit
      # the loop's stdin, and a child that read it would consume the rows for
      # every image after the first.
      - name: Verify just-published images (positive test)
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' <<< "${PUBLISHED}")
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "ERROR: publish reported no images; nothing to verify is not a pass." >&2
            exit 1
          fi
          echo "verifying ${COUNT} image(s)"
          while IFS= read -r REF <&3; do
            [[ -n "$REF" ]] || continue
            echo "::group::verify ${REF}"
            "${COSIGN}" verify \
                --trusted-root="${TRUSTED_ROOT}" \
                --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                "${REF}" > /dev/null
            "${COSIGN}" verify-attestation \
                --trusted-root="${TRUSTED_ROOT}" \
                --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                --type=cyclonedx \
                "${REF}" > /dev/null
            "${SLSA_VERIFIER}" verify-image "${REF}" \
                --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
                --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}"
            echo "OK: ${REF}"
            echo "::endgroup::"
          done 3< <(jq -r '.[].ref' <<< "${PUBLISHED}")

      # Negative tests. Each must fail for the *specific* reason the policy
      # exists to produce; cosign or slsa-verifier failing for any other
      # reason — a Sigstore outage, a deleted fixture — is not evidence of a
      # strict policy, so it fails the job instead of passing vacuously.
      #
      # 1. Our signer regexp must reject a real image signed by someone else.
      #    Google's distroless is signed keyless by Google's workflow: right
      #    issuer, wrong subject. If a future PR widens the regexp, this
      #    starts failing-when-it-should-fail and CI catches it.
      #
      # 2. Our source URI must reject real generator provenance produced for
      #    another repository. The provenance signer is the generator's, the
      #    same for every project that uses it, so this is the check that
      #    stands between us and accepting anyone's provenance on our digest.
      #    kyverno publishes with the same generator; the digest is pinned
      #    because slsa-verifier refuses tag references. If kyverno ever
      #    deletes it, the failure reason changes and this test fails loudly.
      - name: Verify policy is strict (negative tests)
        run: |
          set -euo pipefail
          STDERR=$(mktemp)

          if "${COSIGN}" verify \
              --trusted-root="${TRUSTED_ROOT}" \
              --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
              gcr.io/distroless/static-debian12:nonroot 2> "${STDERR}" > /dev/null; then
            echo "ERROR: signer policy is too permissive — accepted gcr.io/distroless/static-debian12:nonroot, which was signed by Google's workflow, not ours." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          if ! grep -q "none of the expected identities matched" "${STDERR}"; then
            echo "ERROR: cosign rejected the reference, but not because the identity mismatched — this assertion proves nothing about the policy." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          echo "OK: signer policy rejects the signed-by-Google reference."

          FOREIGN=ghcr.io/kyverno/kyverno@sha256:fc3db61bb81c7c8283b9bbab5d92ceb375f1ac35c26027485f7f13605e75ef97
          if "${SLSA_VERIFIER}" verify-image "${FOREIGN}" \
              --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
              --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}" 2> "${STDERR}"; then
            echo "ERROR: provenance policy is too permissive — accepted ${FOREIGN}, whose provenance names kyverno/kyverno as its source." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          if ! grep -q "source used to generate the binary does not match provenance" "${STDERR}"; then
            echo "ERROR: slsa-verifier rejected the reference, but not for a source mismatch — this assertion proves nothing about the policy." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          echo "OK: provenance policy rejects generator provenance produced for another repository."

  # Tags move last, and all or nothing. Until here every pushed image is
  # reachable only by digest; `release` names them. A consumer following
  # `latest` therefore never resolves to a digest that has not passed the
  # full policy, and a run in which any image fails verification releases
  # nothing — a partial release is not a release.
  release:
    name: Release mirror tags
    needs: [publish, verify]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write   # for the cache
      packages: write   # for `crane tag`
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CACHE_SERVICE_ACCOUNT }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          repository-cache: true
          external-cache: true
          cache-save: false
          bazelrc: |
            common --config=ci
            common --config=gcs
            build --stamp

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags exactly the targets `publish` reported and `verify` checked —
      # the same list, not a fresh `bazel query`, so an image the publish loop
      # skipped can never be tagged unverified. `crane_tag` needs the image's
      # digest file and nothing else from the build, so this is cheap: no
      # layer leaves the cache.
      - name: Tag
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail
          while IFS= read -r TARGET <&3; do
            [[ -n "${TARGET}" ]] || continue
            echo "::group::${TARGET}_tag"
            bazel run "${TARGET}_tag"
            echo "::endgroup::"
          done 3< <(jq -r '.[].target' <<< "${PUBLISHED}")

  # ---------------------------------------------------------------------------
  # Cloud Run deploy.
  #
  # Each service is described by a Knative manifest sitting next to its binary
  # — //oci/cmd/registry:service.yaml, //web/cmd/server:service.yaml — and
  # applied with `gcloud run services replace`, once per region. The manifest
  # is the desired state; the deploy only supplies the image and the region.
  #
  # Split in two: `push-gar` does the Bazel work once and publishes a rollout
  # plan — digest-pinned image, manifest path, region — as a single job output.
  # `deploy` walks that plan with nothing but gcloud, so each image is resolved
  # exactly once and every region provably deploys the same bytes rather than
  # each re-deriving them.
  #
  # One deploy job per service, each with its own matrix over that service's
  # regions. They hold no lock over each other and share no failure: a broken
  # `web` image must not stop `registry` reaching its remaining regions, which
  # a single matrix over both could not express — one `fail-fast` cancels
  # every leg in it, whichever service the failure came from.
  #
  # Only the revision ships from here. `//infra` owns everything durable — the
  # Artifact Registry repo, the runtime GSA, and the `allUsers` invoker
  # bindings — and is applied out of band, because none of it changes when a
  # new revision does.
  # ---------------------------------------------------------------------------

  push-gar:
    name: Push images to Artifact Registry
    # Waits on `test`, not on the mirror jobs, so the two run side by side.
    # Nothing flows between them — same build, different registry, and ADR 0006
    # puts the GAR copy on an IAM perimeter rather than a signature one — so
    # ordering here would buy nothing. Neither job pays for the parallelism:
    # `test` runs the CVE gates, which build every image, so both start
    # against a cache `test` warmed rather than one of them warming the other.
    needs: test
    runs-on: ubuntu-latest
    # `prod`'s deployment branch policy names `main` and nothing else, and
    # GitHub validates it *before* minting the OIDC token — so the branch gate
    # lives in the identity layer, not in this YAML, which any committer can
    # edit. The deploy SA's WIF binding is keyed on `attribute.environment/prod`,
    # and the pool's provider condition pins `arkeros/distroless`, so neither
    # another environment nor another repository can impersonate it.
    #
    # No human approves this. What makes a commit deployable is the `test` job
    # at the top of this file, which every job here needs: it reruns
    # `bazel test //...` on `main` itself, so the `main-checks` ruleset — which
    # admins can bypass — only decides where a red test is caught, not whether
    # it ships. Environment, policy and rulesets all live in //infra.
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy_plan: ${{ steps.plan.outputs.deploy_plan }}
    env:
      # The one place a deployed service is named: `<name> <bazel package>`.
      # Every other fact is derived from the package — the image URI from its
      # `image_push_gar`, the manifest and the region list from the files
      # beside it — so adding a service is this row and the files it points at,
      # and adding a region is an edit to one regions.json.
      #
      # GHCR publish/sign/attest needs no entry: the `publish` job above
      # discovers every mirror_push target by query. Only the GAR deploy
      # substrate is enumerated, because only these services are deployed.
      SERVICES: |
        registry oci/cmd/registry
        web web/cmd/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One job gets one set of application-default credentials, so this
      # single auth covers both Artifact Registry and the Bazel cache — which
      # is why //infra grants the deploy account access to the cache bucket
      # too. It has to precede `bazel`, or the first invocation runs cold.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          bazelrc: |
            common --config=ci
            common --config=gcs
            build --stamp

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The digest comes from the build, not from the registry. `image_push_gar`
      # pushes the index its own deploy manifest names, and OCI digests are
      # content addresses, so the two agree by construction. Asking the
      # registry to resolve `:latest` instead would be a race — a concurrent
      # push can move that tag between this job's push and its read.
      #
      # That manifest also carries the registry host and the repository, so the
      # GAR address is read back from the target that pushed it instead of
      # being spelled out again here, where it could drift from the
      # GAR_REGISTRY / GAR_REPOSITORY_PREFIX the push actually used.
      #
      # The table is read on fd 3, not on stdin: `bazel` inherits the loop's
      # stdin, and a child that reads it consumes the rows for every service
      # after the first — which would push and deploy `registry` alone, and
      # pass green.
      - name: Push images and resolve digests
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/services.jsonl"
          while read -r NAME PKG <&3; do
            [[ -n "${NAME}" ]] || continue
            echo "::group::${NAME}"
            bazel run "//${PKG}:image_push_gar"
            # cquery only analyses — it prints a path without producing the
            # file, and --remote_download_outputs=minimal keeps build outputs
            # remote. Build the manifest and pull it down explicitly.
            bazel build --remote_download_outputs=all \
                --output_groups=deploy_manifest "//${PKG}:image_push_gar"
            PUSHED=$(bazel cquery "//${PKG}:image_push_gar" \
                --output=files --output_groups=deploy_manifest)
            IMAGE=$(jq -r '.operations[0] | "\(.registry)/\(.repository)@\(.root.digest)"' "${PUSHED}")
            echo "Deploying ${NAME}: ${IMAGE}"
            jq -c -n --arg service "${NAME}" --arg image "${IMAGE}" \
                --arg manifest "${PKG}/service.yaml" \
                --slurpfile regions "${PKG}/regions.json" \
                '{$service, $image, $manifest, regions: $regions[0]}' \
                >> "${RUNNER_TEMP}/services.jsonl"
            echo "::endgroup::"
          done 3<<< "${SERVICES}"

      # One object keyed by service name, so a service is one key and not a
      # pair of outputs that can be updated apart:
      #
      #   {"registry": {"image": …, "manifest": …, "regions": [ … ]}, "web": …}
      #
      # Regions come from each service's regions.json — the list next to the
      # manifest, so the two move together — and each deploy job matrices over
      # its own entry, in the order that file lists them.
      - name: Plan the rollout
        id: plan
        run: |
          set -euo pipefail
          PLAN=$(jq -c -s 'map({(.service): {image, manifest, regions}}) | add' \
              "${RUNNER_TEMP}/services.jsonl")
          # A service with no regions produces an empty matrix, which GitHub
          # reports against the deploy job as a matrix error rather than
          # against the step that built it. Fail here, where the cause is
          # visible.
          EMPTY=$(jq -r 'to_entries | map(select(.value.regions | length == 0))
                         | map(.key) | join(", ")' <<< "${PLAN}")
          if [[ -n "${EMPTY}" ]]; then
            echo "ERROR: no regions to deploy for: ${EMPTY}" >&2
            exit 1
          fi
          jq . <<< "${PLAN}"
          echo "deploy_plan=${PLAN}" >> "$GITHUB_OUTPUT"

  deploy-registry:
    name: Deploy registry ${{ matrix.region }}
    # Gated on `test` (through `push-gar`) and on nothing from the mirror
    # pipeline. The deploy and the mirror are independent by design (ADR
    # 0014): the GAR copy is trusted by IAM, not by signature, and a mirror
    # failure that has nothing to do with these services — a Rekor outage, a
    # base-image verify failure, a deleted negative-test fixture — must not
    # block a Registry or Directory fix from reaching production. What it
    # gives up is the guarantee that production never runs a digest whose
    # mirror copy failed verification; `test` is what stands in for that.
    needs: push-gar
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    # Only the rollout needs ordering. `test` is order-independent and
    # `push-gar` is content-addressed — pushing the same digest twice, or two
    # digests in either order, converges — so serialising those would cost
    # wall-clock and buy nothing. `gcloud run services replace` is the one step
    # where last-writer-wins decides what production runs, and until the `prod`
    # approval prompt was removed nothing serialised it except the accident of
    # a human not approving two deploys at once.
    #
    # Keyed per region because a concurrency group holds exactly one pending
    # entry and a newly queued entry evicts it: one shared group would have the
    # three matrix legs cancel each other out of that slot. Per region they
    # never contend, while the same region across two runs still queues.
    #
    # `cancel-in-progress: false` so a rollout already talking to Cloud Run is
    # never killed part-way. A superseded *pending* rollout is still dropped,
    # so a burst of pushes settles on the newest commit.
    concurrency:
      group: deploy-registry-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      # Regions are independent replicas of one workload. Deploy them one at a
      # time, and let the first failure cancel the rest, so a bad image stops
      # at the first region instead of all three.
      fail-fast: true
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The plan arrives as environment variables rather than as `${{ }}`
      # inside the script, so nothing from it is ever spliced into the shell
      # before it runs.
      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.image }}
          MANIFEST: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.manifest }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          # The key above is a service name from `push-gar`'s SERVICES table.
          # A rename there that misses this job resolves to null, which would
          # otherwise reach `sed` as an empty image and deploy a manifest with
          # no container.
          if [[ -z "${IMAGE}" || -z "${MANIFEST}" ]]; then
            echo "ERROR: the deploy plan names no image for registry — check the SERVICES table in push-gar." >&2
            exit 1
          fi
          echo "${IMAGE}"
          # The placeholder is a fixed token, so a literal substitution is
          # enough — no YAML templating engine in the deploy path.
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" "${MANIFEST}" \
              | gcloud run services replace - --region="${REGION}"

  deploy-web:
    name: Deploy web ${{ matrix.region }}
    # Same gate as `deploy-registry`, for the same reasons.
    needs: push-gar
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    # Same reasoning as `deploy-registry` above: the rollout is the one step
    # where last-writer-wins decides what production runs, so it is serialised
    # per region.
    #
    # A separate group from the registry's, not a shared one. The two services
    # deploy independently and hold no lock over each other, and sharing a
    # group would make one evict the other from the single pending slot — the
    # same failure the per-region keying avoids within a matrix.
    concurrency:
      group: deploy-web-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      # Regions are independent replicas of one workload. Deploy them one at a
      # time, and let the first failure cancel the rest, so a bad image stops
      # at the first region instead of all three.
      fail-fast: true
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.image }}
          MANIFEST: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.manifest }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" || -z "${MANIFEST}" ]]; then
            echo "ERROR: the deploy plan names no image for web — check the SERVICES table in push-gar." >&2
            exit 1
          fi
          echo "${IMAGE}"
          # The placeholder is a fixed token, so a literal substitution is
          # enough — no YAML templating engine in the deploy path.
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" "${MANIFEST}" \
              | gcloud run services replace - --region="${REGION}"
