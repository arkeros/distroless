name: Update Tarballs
description: Move a runtime tarball lockfile to its newest upstream releases and open a PR if it changed
inputs:
  lockfile:
    description: 'Path to the lockfile consumed by the tarballs module extension, e.g. images/nodejs/nodejs.lock.json'
    required: true
  image:
    description: 'Image the lockfile belongs to (commit scope and branch name), e.g. nodejs'
    required: true
  token:
    description: 'GitHub token for creating PRs and enabling auto-merge'
    required: true
outputs:
  update-needed:
    description: 'Whether the lockfile changed'
    value: ${{ steps.update.outputs.update_needed }}
  pr-number:
    description: 'Pull request number if created'
    value: ${{ steps.create-pr.outputs.pull-request-number }}
runs:
  using: composite
  steps:
    - name: Update tarballs
      id: update
      shell: bash
      # The envoy resolver reads api.github.com, which allows 60 requests an
      # hour unauthenticated — shared across everything on the runner's
      # address, so in practice none. The workflow's own read-only token is
      # all it needs; nodejs.org and the Adoptium API ignore it.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # knife rewrites the lockfile and runs `bazel mod tidy` itself. Its
        # stdout lists the moved lines as `<major>: <from> -> <to>`; keep
        # them for the PR body.
        knife tarballs update "${{ inputs.lockfile }}" | tee /tmp/knife.out

        if [ -z "$(git diff --name-only)" ]; then
          echo "update_needed=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "::group::Lockfile diff"
        git diff -- "${{ inputs.lockfile }}"
        echo "::endgroup::"

        {
          echo 'changes<<EOF'
          grep -E '^  [0-9]+(\.[0-9]+)*: ' /tmp/knife.out | sed 's/^  /- /'
          echo 'EOF'
        } >> $GITHUB_OUTPUT
        echo "update_needed=true" >> $GITHUB_OUTPUT
    - name: Create Pull Request
      if: steps.update.outputs.update_needed == 'true'
      id: create-pr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        commit-message: |
          chore(${{ inputs.image }}): update upstream tarballs

          ${{ steps.update.outputs.changes }}
        branch: update-${{ inputs.image }}-tarballs
        delete-branch: true
        title: 'chore(${{ inputs.image }}): update upstream tarballs'
        body: |
          Moves every release line in `${{ inputs.lockfile }}` to its newest
          upstream release:

          ${{ steps.update.outputs.changes }}

          The image's `_cve_test` runs on this PR against the pinned Grype
          database, so a line that is still vulnerable after the bump fails
          here rather than after publish.

          ---

          This PR was automatically created by the Update Tarballs workflow.
        labels: |
          dependencies
          automated
        assignees: ${{ github.repository_owner }}
    - name: Enable auto-merge
      if: steps.update.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number != ''
      shell: bash
      run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
      env:
        GH_TOKEN: ${{ inputs.token }}
