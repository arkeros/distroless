---
# Push to `main`, and only that. Pull requests run pr.yaml, which can only read.
#
# Every job here that touches Bazel declares `environment: prod`. The
# environment's deployment branch policy names `main` and GitHub checks it
# before minting the OIDC token, so the cache-write and deploy identities are
# unreachable from any other ref regardless of what this file says (ADR 0014,
# infra/cache.tf).
#
# The mirror publishes in four steps — publish, provenance, verify, release —
# because provenance is written by the build platform rather than by us, tags
# must not move until every artifact on a digest has been proven, and the job
# that does the proving must not be able to mutate the registry.
name: CI
on:
  push:
    branches: [main]

# Both values come from `terraform output` in //infra. The cache account is
# separate from the deploy account in github.tf and deliberately weaker: it can
# read and write one GCS bucket and nothing else, which is why every job here
# can hold it while only `push-gar`/`deploy` hold the deploy identity.
env:
  WIF_PROVIDER: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
  CACHE_SERVICE_ACCOUNT: github-actions-cache@senku-prod.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write   # for the remote cache's workload identity federation
    outputs:
      # `{target: digest}` for every mirror image, as built on this runner.
      # `publish` builds them again on its own runner and pushes nothing if
      # the two disagree: a digest that depends on the machine is not a
      # digest, and the mirror must never learn one. The last such case was
      # an mtree entry without `time=` (run 33618108072), caught then by the
      # release job rebuilding; this catches it before anything is pushed.
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CACHE_SERVICE_ACCOUNT }}

      # gRPC cache proxy on this runner, in front of the same bucket; must
      # follow the Google Cloud auth step (it uses those credentials) and
      # precede Bazel's first invocation.
      - name: Set up bazel-remote
        uses: ./.github/actions/setup-bazel-remote
        with:
          bucket: senku-prod-bazel-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # No repository cache: external downloads come through bazel-remote's
          # asset API from the bucket (see .bazelrc). The external cache stays;
          # it holds extracted repositories, which is work, not downloads.
          repository-cache: false
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=bazel-remote

      - name: Test
        run: bazel test //...

      # The deploy manifests name each image's index digest; everything behind
      # them is a cache hit after the tests above, and `toplevel` keeps the
      # layers where they are.
      - name: Record every mirror image's digest
        id: digests
        run: |
          set -euo pipefail
          PUSH_TARGETS=$(bazel query 'attr(tags, mirror_push_managed, kind(image_push, //...))' --output=label | tr '\n' ' ')
          bazel build --remote_download_outputs=toplevel --output_groups=deploy_manifest ${PUSH_TARGETS}
          bazel cquery "set(${PUSH_TARGETS})" --output=starlark --starlark:expr='"%s\t%s" % (str(target.label).removeprefix("@@"), providers(target)["OutputGroupInfo"].deploy_manifest.to_list()[0].path)' \
            | while IFS=$'\t' read -r LABEL MANIFEST; do
                jq -c -n --arg t "${LABEL%_push}" --arg d "$(jq -r '.operations[0].root.digest' "${MANIFEST}")" '{($t): $d}'
              done | jq -c -s 'add' > "${RUNNER_TEMP}/digests.json"
          echo "digests=$(cat "${RUNNER_TEMP}/digests.json")" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Mirror publish.
  #
  # `publish` pushes every mirror image *by digest* — no tag names it yet —
  # then signs it and attests its SBOM, its vulnerability scan and its VEX
  # document, all under this workflow's identity.
  # It then asks the registry which of those digests already carry platform
  # provenance and hands the rest to `provenance` as a matrix.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish mirror images
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write   # for cosign keyless OIDC (Fulcio + Rekor) and the cache
      packages: write   # for GHCR push + cosign sig/attest artifacts
    outputs:
      # JSON list of `{target, ref, tags}` for everything pushed: the
      # mirror_push base label, `<registry>/<repository>@<digest>`, and the
      # expanded tag list. `verify` checks the refs and `release` applies the
      # tags, so both work from one list and the tagged set is the verified
      # set by construction.
      published: ${{ steps.publish.outputs.published }}
      # JSON list of `{image, digest}` for the digests with no provenance yet.
      pending: ${{ steps.publish.outputs.pending }}
      # Everything `verify` needs to run without Bazel or a checkout: the tool
      # versions tools/tools.lock.json pins, the sha256 of the trusted root
      # this job verified with, and the policy strings. See `verify`.
      cosign_version: ${{ steps.inputs.outputs.cosign_version }}
      slsa_verifier_version: ${{ steps.inputs.outputs.slsa_verifier_version }}
      # go.mod's go-containerregistry version; `release` installs that crane.
      crane_version: ${{ steps.inputs.outputs.crane_version }}
      trusted_root_sha256: ${{ steps.inputs.outputs.trusted_root_sha256 }}
      certificate_identity_regexp: ${{ steps.inputs.outputs.certificate_identity_regexp }}
      certificate_oidc_issuer: ${{ steps.inputs.outputs.certificate_oidc_issuer }}
      provenance_builder_id: ${{ steps.inputs.outputs.provenance_builder_id }}
      provenance_source_uri: ${{ steps.inputs.outputs.provenance_source_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only reaches the Bazel cache bucket; pushing to GHCR below is
      # authenticated separately with GITHUB_TOKEN.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CACHE_SERVICE_ACCOUNT }}

      # gRPC cache proxy on this runner, in front of the same bucket; must
      # follow the Google Cloud auth step (it uses those credentials) and
      # precede Bazel's first invocation.
      - name: Set up bazel-remote
        uses: ./.github/actions/setup-bazel-remote
        with:
          bucket: senku-prod-bazel-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # No repository cache: external downloads come through bazel-remote's
          # asset API from the bucket (see .bazelrc). The external cache stays;
          # it holds extracted repositories, which is work, not downloads.
          repository-cache: false
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=bazel-remote
            build --stamp
            # bazel/defaults.bazelrc turns runfiles trees off; this job runs
            # built executables from their trees. Set here for every Bazel
            # command in the job, not on one `build`, or each query and cquery
            # in between flips the option and discards the analysis cache.
            common --build_runfile_links

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both signers' identity pins come from one Starlark file, //oci:cosign_policy.bzl.
      - name: Load verification policy
        run: |
          set -euxo pipefail
          bazel build //oci:cosign_policy_env
          cat "$(bazel cquery //oci:cosign_policy_env --output=files)" >> "$GITHUB_ENV"

      # All three are Bazel outputs: cosign and slsa-verifier are prebuilt and
      # checksum-pinned in tools/tools.lock.json; the Sigstore trusted root is
      # the pinned file //web embeds, handed to every cosign verify below via
      # --trusted-root so no TUF metadata is fetched at publish time (see
      # //oci:sigstore_trusted_root). cosign is needed here to *verify*, not
      # only to sign: publish decides per digest whether a signature and an
      # SBOM attestation of ours already exist.
      - name: Fetch cosign, slsa-verifier and the Sigstore trusted root
        run: |
          set -euo pipefail
          bazel build --remote_download_outputs=all \
              //bazel/toolchains/cosign:prebuilt_cosign_toolchain \
              @multitool//tools/slsa-verifier \
              //oci:sigstore_trusted_root
          echo "COSIGN=$(realpath "$(bazel cquery //bazel/toolchains/cosign:prebuilt_cosign_toolchain --output=files)")" >> "$GITHUB_ENV"
          echo "SLSA_VERIFIER=$(realpath "$(bazel cquery @multitool//tools/slsa-verifier --output=files)")" >> "$GITHUB_ENV"
          echo "TRUSTED_ROOT=$(realpath "$(bazel cquery //oci:sigstore_trusted_root --output=files)")" >> "$GITHUB_ENV"

      # One build for everything the loop below runs: every mirror image's
      # push binary, sign and attest scripts, the predicates those attest,
      # and the deploy manifest that names the digest. Before this, the loop ran three Bazel commands
      # per image — sixty analyses of the same graph, the first one cold at
      # 30 s — for files one invocation produces. A separate step so its cost
      # is visible in the job timeline.
      #
      # Runfiles trees are on for this whole job (see the bazelrc above), so
      # the executables can run from them rather than via `bazel run`.
      # `--remote_download_outputs=toplevel`, not `all`: under
      # lazy push (.bazelrc) the push binaries carry no layers, and `all` would
      # download every layer of every image as an intermediate output anyway —
      # the very thing lazy push exists to avoid. `toplevel` fetches the
      # executables, their runfiles, the deploy manifests and the predicates:
      # kilobytes to megabytes. One cquery then maps each target to its
      # executable and, for pushes, its manifest; for attestations, its
      # predicate — no per-image Bazel from here on.
      - name: Build every mirror image's push, sign and attest targets
        run: |
          set -euo pipefail
          TARGETS=$(bazel query 'kind("cosign_sign rule", //...) + kind("cosign_attest rule", //...) + kind("crane_tag rule", //...) + attr(tags, mirror_push_managed, kind(image_push, //...))' --output=label | tr '\n' ' ')
          bazel build --remote_download_outputs=toplevel \
              --output_groups=+deploy_manifest,+tags,+predicate ${TARGETS}
          # label <TAB> executable <TAB> deploy manifest (pushes) <TAB> expanded tag list (tags) <TAB> predicate (attestations)
          group() { echo "(getattr(providers(target)[\"OutputGroupInfo\"], \"$1\", None).to_list()[0].path if getattr(providers(target)[\"OutputGroupInfo\"], \"$1\", None) else \"\")"; }
          bazel cquery "set(${TARGETS})" --output=starlark --starlark:expr="\"%s\\t%s\\t%s\\t%s\\t%s\" % (str(target.label).removeprefix(\"@@\"), target.files_to_run.executable.path, $(group deploy_manifest), $(group tags), $(group predicate))" \
              > "${RUNNER_TEMP}/mirror_targets.tsv"
          echo "$(wc -l < "${RUNNER_TEMP}/mirror_targets.tsv") targets built"

      # Hand `verify` its inputs as job outputs, so that job needs neither
      # Bazel nor a checkout. The versions come from the lockfile, the root
      # hash from the file this job verifies with, the policy from the env
      # file loaded above — one source for each, read here and checked there.
      - name: Export verification inputs
        id: inputs
        run: |
          set -euo pipefail
          version_of() { jq -r --arg t "$1" '.[$t].binaries[0].url | capture("/download/(?<v>v[0-9.]+)/").v' tools/tools.lock.json; }
          {
            echo "cosign_version=$(version_of cosign)"
            echo "slsa_verifier_version=$(version_of slsa-verifier)"
            echo "crane_version=$(awk '$1 == "github.com/google/go-containerregistry" {print $2}' go.mod)"
            echo "trusted_root_sha256=$(sha256sum "${TRUSTED_ROOT}" | cut -d' ' -f1)"
            echo "certificate_identity_regexp=${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}"
            echo "certificate_oidc_issuer=${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}"
            echo "provenance_builder_id=${COSIGN_POLICY_PROVENANCE_BUILDER_ID}"
            echo "provenance_source_uri=${COSIGN_POLICY_PROVENANCE_SOURCE_URI}"
          } | tee -a "$GITHUB_OUTPUT"

      # `mirror_push` macros emit <name>_push, <name>_sign, <name>_attest_sbom,
      # <name>_attest_vuln, <name>_attest_vex and <name>_tag. Every mirror
      # image has exactly one `_sign`, so the `_sign` rows of the table built
      # above enumerate the images. `_tag` is deliberately not run here — see
      # `release`.
      #
      # Every artifact is added at most once per digest, with two exceptions
      # below. After the push, each one is *verified* under the production
      # policy and classified:
      #   verified      → already there from an earlier run; skip.
      #   absent        → add it: run `_sign` / `_attest_*`, or hand the
      #                   digest to the `provenance` matrix.
      #   anything else → fail. A Rekor or TUF outage must not read as
      #                   "absent" and be answered with a duplicate
      #                   (ADR 0014: one of each per digest).
      #
      # "Absent" for the ones we sign includes "signed, but not by us": a
      # workflow rename heals itself on the next push, and a foreign signature
      # on our digest cannot block a release. Digests are stable across
      # commits when their content is, so a push that changes nothing adds
      # nothing.
      #
      # The exceptions are the two attestations whose truth moves while the
      # digest stands still. A vulnerability scan is only as current as the
      # database it ran against, so a digest is re-attested whenever the
      # pinned database (//bazel/include:oci.MODULE.bazel, bumped daily by
      # update-grype-db.yaml) is newer than the one any scan on the registry
      # names; that is how a build published months ago still shows today's
      # CVEs. A VEX document is re-attested whenever its statements differ
      # from every one already attached — a statement added, withdrawn, or
      # re-justified past its expiry. Each addition is one more referrer; the
      # Directory shows the newest and verifies them all.
      - name: Push, sign, and attest mirror images
        id: publish
        env:
          TEST_DIGESTS: ${{ needs.test.outputs.digests }}
        run: |
          set -euo pipefail

          # needs_artifact WHAT REF VERIFIER...: runs VERIFIER; returns 0 when
          # the artifact is present and ours (skip), 1 when it is absent or
          # someone else's (add), and aborts the job on any other failure.
          needs_artifact() {
            local WHAT=$1 REF=$2; shift 2
            local STDERR; STDERR=$(mktemp)
            if "$@" > /dev/null 2> "${STDERR}"; then
              echo "${WHAT} already present: ${REF}"
              return 0
            fi
            # cosign: nothing signed / signed by someone else / no attestation
            # at all / a foreign one / attestations present but none of the
            # requested type (a freshly signed digest has a signature referrer
            # and nothing else — run 33616446771 failed on exactly that).
            # slsa-verifier: no provenance. Anything else — DNS, TLS, Rekor,
            # TUF — is not a statement about the registry and is not treated
            # as one. (cosign also says "no signatures found" for a repository
            # that does not exist; harmless here, since the push just above is
            # what creates it, and a sign against a missing digest fails loudly
            # on its own.)
            if grep -qE "no signatures found|no matching signatures|no matching attestations|none of the attestations matched the predicate type" "${STDERR}"; then
              echo "${WHAT} absent: ${REF}"
              return 1
            fi
            echo "ERROR: could not tell whether ${REF} has a ${WHAT}; refusing to guess." >&2
            cat "${STDERR}" >&2
            exit 1
          }

          # Runs a built executable the way `bazel run` would: from inside
          # its runfiles tree, with RUNFILES_DIR set. cosign's scripts resolve
          # their inputs relative to that directory; rules_img's pusher reads
          # the variable, and under lazy push streams missing layers from the
          # CAS named by IMG_REAPI_ENDPOINT — which `bazel run` would have set
          # from the .bazelrc setting and a direct execution must set itself.
          run_built() {
            local exe=$1; shift
            local rf; rf=$(realpath "${exe}.runfiles")
            ( cd "${rf}/_main" && RUNFILES_DIR="${rf}" IMG_REAPI_ENDPOINT=grpc://127.0.0.1:9092 "./${exe#bazel-out/*/bin/}" "$@" )
          }
          exe_of() { awk -F'\t' -v l="$1" '$1==l{print $2}' "${RUNNER_TEMP}/mirror_targets.tsv"; }
          manifest_of() { awk -F'\t' -v l="$1" '$1==l{print $3}' "${RUNNER_TEMP}/mirror_targets.tsv"; }
          tags_of() { awk -F'\t' -v l="$1" '$1==l{print $4}' "${RUNNER_TEMP}/mirror_targets.tsv"; }
          predicate_of() { awk -F'\t' -v l="$1" '$1==l{print $5}' "${RUNNER_TEMP}/mirror_targets.tsv"; }

          # attested TYPE REF: prints the predicate of every verified
          # attestation of TYPE on REF, one JSON document per line. Empty when
          # there are none; aborts, like needs_artifact, when cosign fails for
          # a reason that is not a statement about the registry.
          attested() {
            local TYPE=$1 REF=$2
            local STDERR; STDERR=$(mktemp)
            if ! "${COSIGN}" verify-attestation \
                --trusted-root="${TRUSTED_ROOT}" \
                --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                --type="${TYPE}" \
                "${REF}" 2> "${STDERR}" | jq -r '.payload | @base64d | fromjson | .predicate | @json'; then
              if grep -qE "no signatures found|no matching signatures|no matching attestations|none of the attestations matched the predicate type" "${STDERR}"; then
                return 0
              fi
              echo "ERROR: could not list ${TYPE} attestations on ${REF}; refusing to guess." >&2
              cat "${STDERR}" >&2
              exit 1
            fi
          }

          # stale TYPE REF PREDICATE: returns 0 when the attestation built
          # here supersedes every one REF already carries of TYPE, 1 when one
          # of them is as good. The rule itself is the jq module
          # //oci/publish:stale.jq, with its test; this only feeds it what the
          # registry has. A rule that fails — a predicate that is not what its
          # type says, a type with no rule — aborts the job: see the module
          # for why neither guess is safe.
          stale() {
            local TYPE=$1 REF=$2 PREDICATE=$3
            local VERDICT
            VERDICT=$(attested "${TYPE}" "${REF}" \
              | jq -r -s -L oci/publish --arg type "${TYPE}" --slurpfile local "${PREDICATE}" \
                  'include "stale"; stale($type; $local[0])') || {
              echo "ERROR: could not decide whether the ${TYPE} attestation on ${REF} is stale; refusing to guess." >&2
              exit 1
            }
            [[ "${VERDICT}" == "stale" ]]
          }

          # Cross-runner check: the same target built on the `test` runner
          # must have produced the same digest, or nothing about this image
          # is pushed. A digest that differs per machine is not a digest.
          same_digest_as_test() {
            local base=$1 digest=$2
            local expected; expected=$(jq -r --arg t "${base}" '.[$t] // ""' <<< "${TEST_DIGESTS}")
            if [[ "${expected}" != "${digest}" ]]; then
              echo "ERROR: ${base} built as ${digest} on this runner but as ${expected:-<not built>} on the test runner. The image depends on the machine that built it — look for an input that varies per runner (an mtime, a path, a tool version); the last case was an mtree entry without time= (run 33618108072). Nothing was pushed for it." >&2
              return 1
            fi
          }

          : > "${RUNNER_TEMP}/published.jsonl"
          : > "${RUNNER_TEMP}/pending.jsonl"
          for SIGN_TARGET in $(awk -F'\t' '$1 ~ /_sign$/{print $1}' "${RUNNER_TEMP}/mirror_targets.tsv"); do
            BASE=${SIGN_TARGET%_sign}
            echo "::group::${BASE}"

            # The digest comes from the build, not from the registry: the push
            # target's deploy manifest names what it will push, and OCI
            # digests are content addresses, so the two agree by construction.
            MANIFEST=$(manifest_of "${BASE}_push")
            IMAGE=$(jq -r '.operations[0] | "\(.registry)/\(.repository)"' "$MANIFEST")
            DIGEST=$(jq -r '.operations[0].root.digest' "$MANIFEST")
            REF="${IMAGE}@${DIGEST}"
            same_digest_as_test "${BASE}" "${DIGEST}"

            run_built "$(exe_of "${BASE}_push")"

            if ! needs_artifact signature "${REF}" \
                "${COSIGN}" verify \
                  --trusted-root="${TRUSTED_ROOT}" \
                  --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                  --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                  "${REF}"; then
              run_built "$(exe_of "${BASE}_sign")"
            fi

            # One attestation per `_attest_<step>` target the macro emitted,
            # each told apart by the predicate type cosign names it by. The
            # types this image carries go to `verify`, which checks each one
            # again under the production policy: a VEX document is only
            # attested for images that publish statements, so `verify` cannot
            # assume the set.
            TYPES=()
            for ATTESTATION in sbom:cyclonedx vuln:vuln vex:openvex; do
              STEP=${ATTESTATION%%:*}
              TYPE=${ATTESTATION##*:}
              [[ -n "$(exe_of "${BASE}_attest_${STEP}")" ]] || continue
              if ! needs_artifact "${TYPE} attestation" "${REF}" \
                  "${COSIGN}" verify-attestation \
                    --trusted-root="${TRUSTED_ROOT}" \
                    --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                    --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                    --type="${TYPE}" \
                    "${REF}"; then
                run_built "$(exe_of "${BASE}_attest_${STEP}")"
              elif stale "${TYPE}" "${REF}" "$(predicate_of "${BASE}_attest_${STEP}")"; then
                echo "${TYPE} attestation superseded, adding a fresh one: ${REF}"
                run_built "$(exe_of "${BASE}_attest_${STEP}")"
              fi
              TYPES+=("${TYPE}")
            done

            TAGS=$(jq -R . "$(tags_of "${BASE}_tag")" | jq -c -s .)
            ATTESTED=$(printf '%s\n' "${TYPES[@]}" | jq -R . | jq -c -s 'map(select(. != ""))')
            jq -c -n --arg target "${BASE}" --arg ref "${REF}" --argjson tags "${TAGS}" --argjson types "${ATTESTED}" \
              '{$target, $ref, $tags, $types}' >> "${RUNNER_TEMP}/published.jsonl"

            if ! needs_artifact provenance "${REF}" \
                "${SLSA_VERIFIER}" verify-image "${REF}" \
                  --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
                  --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}"; then
              jq -c -n --arg image "${IMAGE}" --arg digest "${DIGEST}" '{$image, $digest}' \
                >> "${RUNNER_TEMP}/pending.jsonl"
            fi
            echo "::endgroup::"
          done
          {
            echo "published=$(jq -c -s . "${RUNNER_TEMP}/published.jsonl")"
            echo "pending=$(jq -c -s . "${RUNNER_TEMP}/pending.jsonl")"
          } | tee -a "$GITHUB_OUTPUT"

  # The build platform writes provenance, not us: the generator is a reusable
  # workflow that runs in its own VM under its own OIDC identity, after our
  # build has finished and with nothing of ours in reach. That separation is
  # what makes the statement SLSA Build L3 rather than something our own
  # build job could have forged. One call per pending digest.
  #
  # The generator MUST be referenced by a full `vX.Y.Z` tag; it refuses
  # shorter tags and SHA pins. Renovate bumps it but does not auto-merge it
  # (//.github/renovate.json) — this line is the trust root of the L3 claim.
  provenance:
    name: Attest provenance
    needs: publish
    if: needs.publish.outputs.pending != '[]'
    permissions:
      actions: read     # the generator reads the run that called it
      id-token: write   # the generator's own keyless signing
      packages: write   # to attach the attestation to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.pending) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Read-only on purpose, and self-contained. Neither cosign nor
  # slsa-verifier needs a token to verify public artifacts, so the job that
  # holds the policy cannot mutate the registry, and it holds no cloud
  # identity either. It does not check out the repository or run Bazel: the
  # tools come from their projects' own installers, at the versions
  # tools/tools.lock.json pins (asserted below), and the policy strings and the
  # trusted root's hash come from `publish`, which computed them with Bazel.
  #
  # `always()` because `provenance` is skipped when nothing was pending, and
  # a skipped dependency would otherwise skip this too.
  verify:
    name: Verify mirror images
    needs: [publish, provenance]
    if: >-
      always()
      && needs.publish.result == 'success'
      && (needs.provenance.result == 'success' || needs.provenance.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      COSIGN: cosign
      SLSA_VERIFIER: slsa-verifier
      COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP: ${{ needs.publish.outputs.certificate_identity_regexp }}
      COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER: ${{ needs.publish.outputs.certificate_oidc_issuer }}
      COSIGN_POLICY_PROVENANCE_BUILDER_ID: ${{ needs.publish.outputs.provenance_builder_id }}
      COSIGN_POLICY_PROVENANCE_SOURCE_URI: ${{ needs.publish.outputs.provenance_source_uri }}
      # The same URL as the `sigstore_trusted_root` http_file in
      # bazel/include/oci.MODULE.bazel. What makes it the same *file* is the
      # hash `publish` reports, checked below.
      TRUSTED_ROOT_URL: https://raw.githubusercontent.com/sigstore/root-signing/main/targets/trusted_root.json
    steps:
      # cosign-installer verifies the binary's signature with a bootstrapped
      # cosign; the version is the lockfile's, passed through `publish`.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ needs.publish.outputs.cosign_version }}

      # The installer verifies slsa-verifier's own SLSA provenance. Its version
      # is this `uses:` ref, which cannot take an expression — hence the check
      # below against the lockfile.
      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      # `publish` classifies with the lockfile's versions; a `verify` running a
      # different one could read an edge case differently. Renovate bumps the
      # lockfile and the installer ref independently, so a half-merged pair
      # fails here, naming both places, rather than silently disagreeing.
      - name: Check the installed tools are the lockfile's versions
        env:
          WANT_COSIGN: ${{ needs.publish.outputs.cosign_version }}
          WANT_SLSA_VERIFIER: ${{ needs.publish.outputs.slsa_verifier_version }}
        run: |
          set -euo pipefail
          have=$(cosign version 2>&1 | awk '/GitVersion/{print $2}')
          if [[ "${have#v}" != "${WANT_COSIGN#v}" ]]; then
            echo "ERROR: cosign ${have} installed, but tools/tools.lock.json pins ${WANT_COSIGN}." >&2
            exit 1
          fi
          have=$(slsa-verifier version 2>&1 | awk '/GitVersion/{print $2}')
          if [[ "${have#v}" != "${WANT_SLSA_VERIFIER#v}" ]]; then
            echo "ERROR: slsa-verifier ${have} installed via the installer's uses: ref in ci.yaml, but tools/tools.lock.json pins ${WANT_SLSA_VERIFIER}. Bump both together." >&2
            exit 1
          fi
          echo "cosign ${have#v}: ok; slsa-verifier ${WANT_SLSA_VERIFIER#v}: ok"

      # The same pinned root `publish` and the Directory verify with. The
      # download is the one network call here that is not a verification, so
      # it retries; the hash check is what makes it the pinned file and not
      # whatever the URL serves today.
      - name: Fetch the pinned Sigstore trusted root
        env:
          EXPECTED_SHA256: ${{ needs.publish.outputs.trusted_root_sha256 }}
        run: |
          set -euo pipefail
          TRUSTED_ROOT="${RUNNER_TEMP}/trusted_root.json"
          curl -fsSL --retry 5 --retry-delay 5 -o "${TRUSTED_ROOT}" "${TRUSTED_ROOT_URL}"
          echo "${EXPECTED_SHA256}  ${TRUSTED_ROOT}" | sha256sum -c -
          echo "TRUSTED_ROOT=${TRUSTED_ROOT}" >> "$GITHUB_ENV"

      # Positive test: every digest `publish` pushed must carry every artifact
      # under the production policy — our signature, each attestation
      # `publish` says it attached (SBOM, vulnerability scan, VEX document),
      # and platform provenance that names *this* repository as its source.
      # An SBOM and a scan are not optional: a mirror image without either is
      # a `mirror_push` that forgot to name them, and fails here by name.
      # Catches a mis-run attest step, a failed matrix leg that `provenance`
      # reported anyway, signer drift between producer and policy, and
      # provenance minted for the wrong source.
      #
      # An empty list is refused first. Zero verifications passing is not
      # evidence of anything — it is the Silent zero this project's gates
      # exist to catch — and `release` would then tag nothing while this job
      # reported green.
      #
      # The list is read on fd 3, as `push-gar` does: the verifiers inherit
      # the loop's stdin, and a child that read it would consume the rows for
      # every image after the first.
      - name: Verify just-published images (positive test)
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' <<< "${PUBLISHED}")
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "ERROR: publish reported no images; nothing to verify is not a pass." >&2
            exit 1
          fi
          echo "verifying ${COUNT} image(s)"
          while IFS=$'\t' read -r REF TYPES <&3; do
            [[ -n "$REF" ]] || continue
            echo "::group::verify ${REF}"
            for REQUIRED in cyclonedx vuln; do
              if [[ " ${TYPES} " != *" ${REQUIRED} "* ]]; then
                echo "ERROR: ${REF} was published without a ${REQUIRED} attestation; every mirror image carries an SBOM and a vulnerability scan." >&2
                exit 1
              fi
            done
            "${COSIGN}" verify \
                --trusted-root="${TRUSTED_ROOT}" \
                --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                "${REF}" > /dev/null
            for TYPE in ${TYPES}; do
              "${COSIGN}" verify-attestation \
                  --trusted-root="${TRUSTED_ROOT}" \
                  --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                  --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                  --type="${TYPE}" \
                  "${REF}" > /dev/null
            done
            "${SLSA_VERIFIER}" verify-image "${REF}" \
                --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
                --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}"
            echo "OK: ${REF} (${TYPES})"
            echo "::endgroup::"
          done 3< <(jq -r '.[] | [.ref, (.types | join(" "))] | @tsv' <<< "${PUBLISHED}")

      # Negative tests. Each must fail for the *specific* reason the policy
      # exists to produce; cosign or slsa-verifier failing for any other
      # reason — a Sigstore outage, a deleted fixture — is not evidence of a
      # strict policy, so it fails the job instead of passing vacuously.
      #
      # 1. Our signer regexp must reject a real image signed by someone else.
      #    Google's distroless is signed keyless by Google's workflow: right
      #    issuer, wrong subject. If a future PR widens the regexp, this
      #    starts failing-when-it-should-fail and CI catches it.
      #
      # 2. Our source URI must reject real generator provenance produced for
      #    another repository. The provenance signer is the generator's, the
      #    same for every project that uses it, so this is the check that
      #    stands between us and accepting anyone's provenance on our digest.
      #    kyverno publishes with the same generator; the digest is pinned
      #    because slsa-verifier refuses tag references. If kyverno ever
      #    deletes it, the failure reason changes and this test fails loudly.
      - name: Verify policy is strict (negative tests)
        run: |
          set -euo pipefail
          STDERR=$(mktemp)

          if "${COSIGN}" verify \
              --trusted-root="${TRUSTED_ROOT}" \
              --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
              gcr.io/distroless/static-debian12:nonroot 2> "${STDERR}" > /dev/null; then
            echo "ERROR: signer policy is too permissive — accepted gcr.io/distroless/static-debian12:nonroot, which was signed by Google's workflow, not ours." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          if ! grep -q "none of the expected identities matched" "${STDERR}"; then
            echo "ERROR: cosign rejected the reference, but not because the identity mismatched — this assertion proves nothing about the policy." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          echo "OK: signer policy rejects the signed-by-Google reference."

          FOREIGN=ghcr.io/kyverno/kyverno@sha256:fc3db61bb81c7c8283b9bbab5d92ceb375f1ac35c26027485f7f13605e75ef97
          if "${SLSA_VERIFIER}" verify-image "${FOREIGN}" \
              --source-uri "${COSIGN_POLICY_PROVENANCE_SOURCE_URI}" \
              --builder-id "${COSIGN_POLICY_PROVENANCE_BUILDER_ID}" 2> "${STDERR}"; then
            echo "ERROR: provenance policy is too permissive — accepted ${FOREIGN}, whose provenance names kyverno/kyverno as its source." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          if ! grep -q "source used to generate the binary does not match provenance" "${STDERR}"; then
            echo "ERROR: slsa-verifier rejected the reference, but not for a source mismatch — this assertion proves nothing about the policy." >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          echo "OK: provenance policy rejects generator provenance produced for another repository."

  # Tags move last. Until here every pushed image is reachable only by
  # digest; `release` names them, with the tags `publish` expanded from the
  # build and `verify` saw beside each ref. A consumer following `latest`
  # therefore never resolves to a digest that has not passed the full policy.
  #
  # No Bazel, no checkout, no cloud identity: everything this job needs is in
  # `publish`'s output, and `crane tag` is one request per tag. The
  # cross-runner digest check that used to live here — release rebuilding the
  # image and refusing to tag a digest publish had not pushed — moved to
  # `test` and `publish`, where it stops the push itself.
  #
  # `always()` for the same reason as `verify`: GitHub skips a job whose
  # transitive `needs` chain contains a skipped job unless the job carries its
  # own status expression, and `provenance` is skipped on every run in which
  # no digest changed.
  release:
    name: Release mirror tags
    needs: [publish, verify]
    if: >-
      always()
      && needs.publish.result == 'success'
      && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write   # for `crane tag`
    env:
      PUBLISHED: ${{ needs.publish.outputs.published }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The crane that matches go.mod's go-containerregistry, passed through
      # `publish`, so the tool here is the one the repository builds from.
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7
        with:
          version: ${{ needs.publish.outputs.crane_version }}

      # Every (ref, tag) pair, eight at a time. Failures are collected rather
      # than stopping the loop — a stopped loop leaves the earlier images
      # tagged anyway — and the job fails at the end if any tag did not land,
      # naming each one.
      - name: Tag
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' <<< "${PUBLISHED}")
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "ERROR: publish reported no images; nothing to tag is not a release." >&2
            exit 1
          fi
          jq -r '.[] | .ref as $ref | .tags[] | "\($ref) \(.)"' <<< "${PUBLISHED}" > "${RUNNER_TEMP}/tags.txt"
          echo "$(wc -l < "${RUNNER_TEMP}/tags.txt" | tr -d ' ') tags over ${COUNT} images"
          : > "${RUNNER_TEMP}/failed.txt"
          xargs -P 8 -L 1 bash -c '
            if crane tag "$0" "$1" > /dev/null 2> "${RUNNER_TEMP}/err.$$"; then
              echo "ok    $0 $1"
            else
              echo "FAIL  $0 $1: $(tr "\n" " " < "${RUNNER_TEMP}/err.$$")" | tee -a "${RUNNER_TEMP}/failed.txt"
            fi
            rm -f "${RUNNER_TEMP}/err.$$"' < "${RUNNER_TEMP}/tags.txt"
          if [[ -s "${RUNNER_TEMP}/failed.txt" ]]; then
            echo "ERROR: $(wc -l < "${RUNNER_TEMP}/failed.txt" | tr -d ' ') tag(s) failed:" >&2
            cat "${RUNNER_TEMP}/failed.txt" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cloud Run deploy.
  #
  # Each service is described by a Knative manifest sitting next to its binary
  # — //oci/cmd/registry:service.yaml, //web/cmd/server:service.yaml — and
  # applied with `gcloud run services replace`, once per region. The manifest
  # is the desired state; the deploy only supplies the image and the region.
  #
  # Split in two: `push-gar` does the Bazel work once and publishes a rollout
  # plan — digest-pinned image, manifest path, region — as a single job output.
  # `deploy` walks that plan with nothing but gcloud, so each image is resolved
  # exactly once and every region provably deploys the same bytes rather than
  # each re-deriving them.
  #
  # One deploy job per service, each with its own matrix over that service's
  # regions. They hold no lock over each other and share no failure: a broken
  # `web` image must not stop `registry` reaching its remaining regions, which
  # a single matrix over both could not express — one `fail-fast` cancels
  # every leg in it, whichever service the failure came from.
  #
  # Only the revision ships from here. `//infra` owns everything durable — the
  # Artifact Registry repo, the runtime GSA, and the `allUsers` invoker
  # bindings — and is applied out of band, because none of it changes when a
  # new revision does.
  # ---------------------------------------------------------------------------

  push-gar:
    name: Push images to Artifact Registry
    # Waits on `test`, not on the mirror jobs, so the two run side by side.
    # Nothing flows between them — same build, different registry, and ADR 0006
    # puts the GAR copy on an IAM perimeter rather than a signature one — so
    # ordering here would buy nothing. Neither job pays for the parallelism:
    # `test` runs the CVE gates, which build every image, so both start
    # against a cache `test` warmed rather than one of them warming the other.
    needs: test
    runs-on: ubuntu-latest
    # `prod`'s deployment branch policy names `main` and nothing else, and
    # GitHub validates it *before* minting the OIDC token — so the branch gate
    # lives in the identity layer, not in this YAML, which any committer can
    # edit. The deploy SA's WIF binding is keyed on `attribute.environment/prod`,
    # and the pool's provider condition pins `arkeros/distroless`, so neither
    # another environment nor another repository can impersonate it.
    #
    # No human approves this. What makes a commit deployable is the `test` job
    # at the top of this file, which every job here needs: it reruns
    # `bazel test //...` on `main` itself, so the `main-checks` ruleset — which
    # admins can bypass — only decides where a red test is caught, not whether
    # it ships. Environment, policy and rulesets all live in //infra.
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy_plan: ${{ steps.plan.outputs.deploy_plan }}
    env:
      # The one place a deployed service is named: `<name> <bazel package>`.
      # Every other fact is derived from the package — the image URI from its
      # `image_push_gar`, the manifest and the region list from the files
      # beside it — so adding a service is this row and the files it points at,
      # and adding a region is an edit to one regions.json.
      #
      # GHCR publish/sign/attest needs no entry: the `publish` job above
      # discovers every mirror_push target by query. Only the GAR deploy
      # substrate is enumerated, because only these services are deployed.
      SERVICES: |
        registry oci/cmd/registry
        web web/cmd/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One job gets one set of application-default credentials, so this
      # single auth covers both Artifact Registry and the Bazel cache — which
      # is why //infra grants the deploy account access to the cache bucket
      # too. It has to precede `bazel`, or the first invocation runs cold.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com
          token_format: access_token

      # gRPC cache proxy on this runner, in front of the same bucket; must
      # follow the Google Cloud auth step (it uses those credentials) and
      # precede Bazel's first invocation.
      - name: Set up bazel-remote
        uses: ./.github/actions/setup-bazel-remote
        with:
          bucket: senku-prod-bazel-cache

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # Same as the other jobs: archives from the bucket via the proxy,
          # extracted repositories kept between runs.
          repository-cache: false
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
            common --config=bazel-remote
            build --stamp

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The digest comes from the build, not from the registry. `image_push_gar`
      # pushes the index its own deploy manifest names, and OCI digests are
      # content addresses, so the two agree by construction. Asking the
      # registry to resolve `:latest` instead would be a race — a concurrent
      # push can move that tag between this job's push and its read.
      #
      # That manifest also carries the registry host and the repository, so the
      # GAR address is read back from the target that pushed it instead of
      # being spelled out again here, where it could drift from the
      # GAR_REGISTRY / GAR_REPOSITORY_PREFIX the push actually used.
      #
      # The table is read on fd 3, not on stdin: `bazel` inherits the loop's
      # stdin, and a child that reads it consumes the rows for every service
      # after the first — which would push and deploy `registry` alone, and
      # pass green.
      - name: Push images and resolve digests
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/services.jsonl"
          while read -r NAME PKG <&3; do
            [[ -n "${NAME}" ]] || continue
            echo "::group::${NAME}"
            bazel run "//${PKG}:image_push_gar"
            # cquery only analyses — it prints a path without producing the
            # file, and --remote_download_outputs=minimal keeps build outputs
            # remote. Build the manifest and pull it down explicitly.
            bazel build --remote_download_outputs=all \
                --output_groups=deploy_manifest "//${PKG}:image_push_gar"
            PUSHED=$(bazel cquery "//${PKG}:image_push_gar" \
                --output=files --output_groups=deploy_manifest)
            IMAGE=$(jq -r '.operations[0] | "\(.registry)/\(.repository)@\(.root.digest)"' "${PUSHED}")
            echo "Deploying ${NAME}: ${IMAGE}"
            jq -c -n --arg service "${NAME}" --arg image "${IMAGE}" \
                --arg manifest "${PKG}/service.yaml" \
                --slurpfile regions "${PKG}/regions.json" \
                '{$service, $image, $manifest, regions: $regions[0]}' \
                >> "${RUNNER_TEMP}/services.jsonl"
            echo "::endgroup::"
          done 3<<< "${SERVICES}"

      # One object keyed by service name, so a service is one key and not a
      # pair of outputs that can be updated apart:
      #
      #   {"registry": {"image": …, "manifest": …, "regions": [ … ]}, "web": …}
      #
      # Regions come from each service's regions.json — the list next to the
      # manifest, so the two move together — and each deploy job matrices over
      # its own entry, in the order that file lists them.
      - name: Plan the rollout
        id: plan
        run: |
          set -euo pipefail
          PLAN=$(jq -c -s 'map({(.service): {image, manifest, regions}}) | add' \
              "${RUNNER_TEMP}/services.jsonl")
          # A service with no regions produces an empty matrix, which GitHub
          # reports against the deploy job as a matrix error rather than
          # against the step that built it. Fail here, where the cause is
          # visible.
          EMPTY=$(jq -r 'to_entries | map(select(.value.regions | length == 0))
                         | map(.key) | join(", ")' <<< "${PLAN}")
          if [[ -n "${EMPTY}" ]]; then
            echo "ERROR: no regions to deploy for: ${EMPTY}" >&2
            exit 1
          fi
          jq . <<< "${PLAN}"
          echo "deploy_plan=${PLAN}" >> "$GITHUB_OUTPUT"

  deploy-registry:
    name: Deploy registry ${{ matrix.region }}
    # Gated on `test` (through `push-gar`) and on nothing from the mirror
    # pipeline. The deploy and the mirror are independent by design (ADR
    # 0014): the GAR copy is trusted by IAM, not by signature, and a mirror
    # failure that has nothing to do with these services — a Rekor outage, a
    # base-image verify failure, a deleted negative-test fixture — must not
    # block a Registry or Directory fix from reaching production. What it
    # gives up is the guarantee that production never runs a digest whose
    # mirror copy failed verification; `test` is what stands in for that.
    needs: push-gar
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    # Only the rollout needs ordering. `test` is order-independent and
    # `push-gar` is content-addressed — pushing the same digest twice, or two
    # digests in either order, converges — so serialising those would cost
    # wall-clock and buy nothing. `gcloud run services replace` is the one step
    # where last-writer-wins decides what production runs, and until the `prod`
    # approval prompt was removed nothing serialised it except the accident of
    # a human not approving two deploys at once.
    #
    # Keyed per region because a concurrency group holds exactly one pending
    # entry and a newly queued entry evicts it: one shared group would have the
    # three matrix legs cancel each other out of that slot. Per region they
    # never contend, while the same region across two runs still queues.
    #
    # `cancel-in-progress: false` so a rollout already talking to Cloud Run is
    # never killed part-way. A superseded *pending* rollout is still dropped,
    # so a burst of pushes settles on the newest commit.
    concurrency:
      group: deploy-registry-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      # Regions are independent replicas of one workload. Deploy them one at a
      # time, and let the first failure cancel the rest, so a bad image stops
      # at the first region instead of all three.
      fail-fast: true
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The plan arrives as environment variables rather than as `${{ }}`
      # inside the script, so nothing from it is ever spliced into the shell
      # before it runs.
      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.image }}
          MANIFEST: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).registry.manifest }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          # The key above is a service name from `push-gar`'s SERVICES table.
          # A rename there that misses this job resolves to null, which would
          # otherwise reach `sed` as an empty image and deploy a manifest with
          # no container.
          if [[ -z "${IMAGE}" || -z "${MANIFEST}" ]]; then
            echo "ERROR: the deploy plan names no image for registry — check the SERVICES table in push-gar." >&2
            exit 1
          fi
          echo "${IMAGE}"
          # The placeholder is a fixed token, so a literal substitution is
          # enough — no YAML templating engine in the deploy path.
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" "${MANIFEST}" \
              | gcloud run services replace - --region="${REGION}"

  deploy-web:
    name: Deploy web ${{ matrix.region }}
    # Same gate as `deploy-registry`, for the same reasons.
    needs: push-gar
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    # Same reasoning as `deploy-registry` above: the rollout is the one step
    # where last-writer-wins decides what production runs, so it is serialised
    # per region.
    #
    # A separate group from the registry's, not a shared one. The two services
    # deploy independently and hold no lock over each other, and sharing a
    # group would make one evict the other from the single pending slot — the
    # same failure the per-region keying avoids within a matrix.
    concurrency:
      group: deploy-web-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      # Regions are independent replicas of one workload. Deploy them one at a
      # time, and let the first failure cancel the rest, so a bad image stops
      # at the first region instead of all three.
      fail-fast: true
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.regions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: github-actions-distroless@senku-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.image }}
          MANIFEST: ${{ fromJSON(needs.push-gar.outputs.deploy_plan).web.manifest }}
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" || -z "${MANIFEST}" ]]; then
            echo "ERROR: the deploy plan names no image for web — check the SERVICES table in push-gar." >&2
            exit 1
          fi
          echo "${IMAGE}"
          # The placeholder is a fixed token, so a literal substitution is
          # enough — no YAML templating engine in the deploy path.
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" "${MANIFEST}" \
              | gcloud run services replace - --region="${REGION}"
