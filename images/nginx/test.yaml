schemaVersion: 2.0.0
metadataTest:
  entrypoint: ['/usr/sbin/nginx', '-e', '/dev/stderr', '-g', 'daemon off;']
fileExistenceTests:
  - name: 'nginx binary exists'
    path: '/usr/sbin/nginx'
    shouldExist: true
  - name: 'nginx config exists'
    path: '/etc/nginx/nginx.conf'
    shouldExist: true
  - name: 'default server config exists'
    path: '/etc/nginx/conf.d/default.conf'
    shouldExist: true
  # Without the per-Google PACKAGE_METADATA.md status files, syft's dpkg
  # cataloger returns zero packages and `grype <image>` reports false
  # negatives on every Debian CVE. libc6 stands for the base closure.
  - name: 'dpkg status.d entry for libc6'
    path: '/var/lib/dpkg/status.d/libc6'
    shouldExist: true
  # nginx is the exception: it is nginx.org's build, identified by upstream
  # version and CPE (`upstream_identities` in bazel/include/oci.MODULE.bazel).
  # A dpkg status entry would make a scanner call it a Debian package and
  # compare it against Debian's own fixed versions; without one, syft reads
  # the version out of the binary (the command test below is what it reads).
  - name: 'no dpkg status.d entry for nginx'
    path: '/var/lib/dpkg/status.d/nginx'
    shouldExist: false
commandTests:
  - name: 'nginx reports its upstream version, which is what a scanner reads'
    command: '/usr/sbin/nginx'
    args: ['-v']
    expectedError: ['nginx version: nginx/[0-9]+[.][0-9]+[.][0-9]+']
  - name: 'nginx config is valid'
    command: '/usr/sbin/nginx'
    args: ['-t', '-e', '/dev/stderr']
    exitCode: 0
fileContentTests:
  - name: 'nginx listens on 8080'
    path: '/etc/nginx/conf.d/default.conf'
    expectedContents: ['listen 8080']
