---
# Pull requests: test, and nothing else. ci.yaml, on `main` alone, is what
# publishes and deploys.
# Why the split: docs/adr/0014-platform-provenance-slsa-github-generator.md.
# modules.yaml runs alongside this, for the workspaces under bazel/modules
# that `bazel test //...` here does not reach.
name: PR
# Any base, not `main` alone: a stacked pull request, one whose base is the
# branch of the pull request below it, is tested where it sits rather than
# only once the one below merges and GitHub retargets it.
on:
  pull_request:

jobs:
  test:
    # `Test` is the check the `main-checks` ruleset in //infra requires.
    # Renaming this job silently disables that rule.
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # Action results rather than downloaded archives; ci.yaml's `test`
          # job carries the reasoning. Set on setup-bazel and not on
          # setup-aspect below because setup-aspect runs *after* the `Test`
          # step: a `--disk_cache` it wrote would arrive too late for the
          # command that needed it.
          disk-cache: true
          # Restore only: a pull request reads the caches `main` warmed and
          # saves nothing another run would read.
          cache-save: false
          bazelrc: |
            common --config=ci

      # Measurement, not correctness. `bazel test //...` below fetches
      # anything this misses, so deleting this step changes nothing but the
      # timings. It is here because 4c0d345 traded the repository and external
      # caches for a disk cache, and this step's wall time is the number that
      # decides whether that was right: it is what those caches used to save.
      #
      # It is not network time. The repo rules here do real work — the Debian
      # apt resolve, gazelle's go_deps, rpm extraction — and this counts that
      # and the loading and analysis with it. It also under-counts: a repo
      # reached only through a lazily evaluated extension, a transition or an
      # aspect is fetched later, by the command that first needs it.
      #
      # Free in job time: the same Bazel server serves both commands, so the
      # analysis this does is warm for the test run rather than repeated.
      - name: Fetch
        run: bazel fetch //...

      # `--build_event_json_file`: the stream carries the sha256 of every
      # output this build produced, which `affected` reduces to one hash per
      # target and diffs against `main`'s. Metadata Bazel emits anyway, so the
      # flag costs the write and nothing else.
      - name: Test
        run: bazel test //... --build_event_json_file="${RUNNER_TEMP}/bep.json"

      # Handed to `affected` through an artifact, which is the only way one
      # job reaches another's files. Cheap here and nowhere else: `knife` is
      # already built and every output is already digested, where `affected`
      # would have to build the graph again to learn the same thing.
      - name: Store the build event stream
        uses: actions/upload-artifact@v7
        with:
          name: build-events
          path: ${{ runner.temp }}/bep.json
          # Read by `affected` in this same run, so it needs to survive
          # minutes, not months. The fortnight is for looking back at a
          # branch's build by hand.
          retention-days: 14

      # The launcher only; .aspect/version.axl pins the CLI it fetches.
      # bazelisk is on PATH from setup-bazel above, so the action skips its
      # own, and its caches stay off: setup-bazel above owns them.
      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      # The linters in //tools/lint over every target. `hard`: any finding
      # fails the check. The tree is clean, and hold-the-line would need a
      # diff base this shallow checkout does not have.
      - name: Lint
        run: aspect lint --strategy=hard -- //...

  # Its own job, where `Lint` above is not. `aspect lint` is
  # `bazel build --config=lint //...`: it needs the whole graph loaded and
  # analysed, which is warm in `Test` only because `bazel test //...` just ran
  # there, and which no cache can carry between jobs. `aspect format` needs
  # none of it — //tools/format is five formatter binaries walking the
  # checkout — so it is cheap to run in parallel and, being the failure most
  # changes actually hit, worth not queueing behind the tests.
  format:
    # `Format` is a required check in the `main-checks` ruleset (infra/repo.tf)
    # because it stopped riding on `Test`'s result when it moved out. Renaming
    # this job silently disables that rule.
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # Its own key. This job builds //tools/format and nothing else, so
          # it has no use for the `disk` cache the full build writes and no
          # reason to pay to download it.
          disk-cache: format
          cache-save: false
          bazelrc: |
            common --config=ci

      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      # Every file the formatters in //tools/format know, failing when any
      # came back changed.
      - name: Format
        run: aspect format --scope=all --severity=fail

  # Separate from `Test`, not a step inside it. `--collect_code_coverage` is a
  # different Bazel configuration, so nothing here could reuse that job's
  # analysis cache anyway, and this way the two run in parallel. In ci.yaml the
  # same split matters for a second reason: `publish` is `needs: test`, and
  # coverage has no business upstream of the digests it signs.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # octocov's comment
      actions: read # octocov reads the report artifact `main` stored
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `aspect coverage` diffs against the merge base with `origin/main`
          # to find the added lines; the depth-1 checkout `test` uses has none.
          fetch-depth: 0

      # The one thing .aspect/coverage.axl expects from the host, because the
      # LCOV toolchain is Perl scripts with no binary release to pin.
      # ubuntu-latest does not ship them.
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          disk-cache: true
          cache-save: false
          bazelrc: |
            common --config=ci

      - name: Set up Aspect CLI
        uses: aspect-build/setup-aspect@1ccd1e095c68556648eb5482231283e445e3dc5e # 2026.34
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false

      # Only the go_test and js_test targets run. `--fail-under` gates the
      # lines this change added; the per-file table, the changed-line rows and
      # the misses all go to the job summary.
      - name: Coverage
        shell: bash # -eo pipefail, or `tee` swallows the gate's exit code
        run: |
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          aspect coverage --fail-under=80 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >>"$GITHUB_STEP_SUMMARY"

      # Comments the overall number and its movement against `main`. Runs even
      # when the gate above failed: that is exactly when the comment is worth
      # reading. `version` and `checksum` pin the binary by content — this is a
      # single-maintainer tool, so it is pinned like one.
      - name: Report coverage
        if: ${{ !cancelled() }}
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .octocov.yml
          version: v0.77.0
          checksum: 2f9032c0484f719cf773a9b6d479e4b6ab4689388fa4b0c84be89a9eb35d60b4

      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: bazel-coverage/html

  # What this pull request changes, as Bazel sees it. Informational: it never
  # gates a merge.
  #
  # Its own job, not a step in `Test`, for two reasons. `Test` is the required
  # check in the `main-checks` ruleset, and a report nobody asked to be
  # blocked by has no business failing it — hence `continue-on-error` below
  # too. And target-determinator needs the merge base, which `Test`'s depth-1
  # checkout deliberately does not have; the `coverage` job pays the same
  # price for the same reason.
  #
  # It costs a second analysis of the graph, at the base revision, which no
  # other job here has a use for. That is the price of the question: nothing
  # cheaper than analysing both revisions can tell you that a three-line
  # go.sum bump moved a published image.
  affected:
    name: Affected targets
    runs-on: ubuntu-latest
    continue-on-error: true
    # `needs: test` for its digest map, which is nearly free to produce there
    # and would cost a second build of everything here. The comment is that
    # much later as a result; nothing waits on it, and the half that answers
    # "what actually changed" is worth the wait over the half that answers
    # "what will rebuild".
    #
    # `!cancelled()` rather than the default: a failing `Test` is exactly when
    # knowing what the change touches is worth most. The digest half degrades
    # to a note when its artifact never arrived.
    needs: test
    if: ${{ !cancelled() }}
    # Two cold analyses of the whole graph, and nothing downstream waits on
    # the answer. A bound so a hang costs an hour rather than the six the
    # default would allow.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # the comment below
      actions: read # `main`'s stored digest map, as octocov reads its report
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # target-determinator checks the base revision out to analyse it, so
          # the base commit has to be in the clone.
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          disk-cache: true
          cache-save: false
          bazelrc: |
            common --config=ci

      # Resolved to a path and executed directly, the way ci.yaml resolves
      # slsa-verifier, rather than run through `bazel run`: the binary's whole
      # job is to drive Bazel in this workspace.
      # Both tools in one invocation, since the graph is loaded either way.
      #
      # `config(..., target)` for knife, not the bare label: the cross-compile
      # wrappers (`knife-linux-arm64` and friends) transition that same
      # target, so once they have been analysed the bare label resolves to one
      # path per configuration. The target configuration is the untransitioned
      # one, and the only one certain to run on this runner.
      - name: Fetch target-determinator and knife
        run: |
          set -euo pipefail
          bazel build @multitool//tools/target-determinator //bazel/cmd/knife
          echo "TARGET_DETERMINATOR=$(realpath "$(bazel cquery @multitool//tools/target-determinator --output=files)")" >> "$GITHUB_ENV"
          echo "KNIFE=$(realpath "$(bazel cquery 'config(//bazel/cmd/knife, target)' --output=files)")" >> "$GITHUB_ENV"

      - name: Affected targets
        shell: bash # -eo pipefail, or `tee` swallows the script's exit code
        run: ./.github/affected-targets.sh '${{ github.event.pull_request.base.sha }}' > "$RUNNER_TEMP/affected.md"

      # This branch's stream, from the `Test` job of this same run.
      - name: Fetch this branch's build events
        uses: actions/download-artifact@v7
        continue-on-error: true # `Test` may have failed before storing it
        with:
          name: build-events
          path: ${{ runner.temp }}/current

      # `main`'s stream, from the most recent run that actually stored one.
      #
      # Not "the last successful run": the stream is written by `Test`, which
      # finishes long before `publish` and the deploy jobs decide the run's
      # conclusion. Keying on the run being green would hide a perfectly good
      # baseline for the half hour those take, and hide it permanently
      # whenever a deploy fails for reasons that have nothing to do with what
      # the build produced. The artifact's own existence is the better signal:
      # `upload-artifact` only runs when the steps before it passed.
      #
      # Absent on the first run after this lands, and after the fortnight an
      # artifact lives; digest-diff.sh says so rather than reporting every
      # target as new.
      - name: Fetch main's build events
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/baseline"
          for RUN in $(gh run list --workflow=ci.yaml --branch=main --limit 10 \
              --json databaseId --jq '.[].databaseId'); do
            if gh run download "${RUN}" --name build-events --dir "${RUNNER_TEMP}/baseline" 2>/dev/null; then
              echo "baseline from run ${RUN}"
              exit 0
            fi
          done
          echo "no ci.yaml run on main has stored build events yet"

      # Both streams reduced by one binary, this branch's. That is the reason
      # the artifact is the stream and not a map: were `main` to store a map,
      # it would have been reduced by `main`'s knife, and the first change to
      # how a target is hashed would make every target differ from a baseline
      # in the old format until `main` next ran.
      - name: Reduce both streams to output digests
        shell: bash
        run: |
          set -euo pipefail
          for SIDE in baseline current; do
            echo '{}' > "${RUNNER_TEMP}/${SIDE}.json"
            if [[ -f "${RUNNER_TEMP}/${SIDE}/bep.json" ]]; then
              "${KNIFE}" bep digests "${RUNNER_TEMP}/${SIDE}/bep.json" > "${RUNNER_TEMP}/${SIDE}.json"
            fi
            echo "${SIDE}: $(jq -r 'length' "${RUNNER_TEMP}/${SIDE}.json") targets with output"
          done

      # Digests first: "what does this change?" is answered by the bytes that
      # moved, and only then by what Bazel will rebuild. The marker is what
      # the comment step finds this comment by on the next push.
      - name: Assemble the report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '<!-- affected-targets -->'
            if [[ "$(jq -r 'length' "${RUNNER_TEMP}/current.json")" != "0" ]]; then
              ./.github/digest-diff.sh "${RUNNER_TEMP}/baseline.json" "${RUNNER_TEMP}/current.json"
            else
              echo '## Outputs that actually changed'
              echo
              echo 'The `Test` job stored no build events for this branch, so there is'
              echo 'nothing to compare. It usually failed before it got that far.'
            fi
            echo
            cat "${RUNNER_TEMP}/affected.md"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/comment.md"

      # In the pull request, not only in the job summary: the summary is three
      # clicks into the Actions tab, and a report you have to go looking for
      # does not answer "what does this change?" for the person reading the
      # diff.
      #
      # Edited in place rather than appended to, so a branch that is pushed
      # five times carries one comment and not five. `--edit-last` is not
      # enough to find it: octocov comments on these same pull requests as the
      # same bot, and the last comment is as likely to be its coverage table
      # as ours. The marker the step above writes is what identifies it.
      #
      # Skipped for a pull request from a fork, where GITHUB_TOKEN is
      # read-only and this could only fail.
      - name: Comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One id per line, last wins: `--jq` runs once per page under
          # `--paginate`, so anything that reduces across the whole list (a
          # `map`, a `last`) would answer per page instead.
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- affected-targets -->")) | .id' | tail -1)
          if [[ -n "${ID}" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@"$RUNNER_TEMP/comment.md"
          fi
