name: Update Debian Packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
concurrency:
  group: update-debian-packages
  cancel-in-progress: false
jobs:
  update:
    name: Update Debian packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
      # The published release, not a source build: knife pulls ~300 external
      # repos (anchore/syft, the AWS SDK, the LLVM toolchain), and
      # release-cli.yaml publishes one on every push to `main` that changes
      # it. `version` unset resolves the latest `knife/*` tag. Bazel above
      # stays: knife shells out to `bazel mod tidy` (bazel/mod/mod.go).
      - name: Install knife
        uses: ./.github/actions/setup-knife
      - name: Update Debian packages
        uses: ./.github/actions/update-debian-packages
        with:
          manifests: >-
            images/debian.yaml
            images/nginx/nginx-stable.yaml
            images/nginx/nginx-mainline.yaml
          token: ${{ secrets.RENOVATE_TOKEN }}
