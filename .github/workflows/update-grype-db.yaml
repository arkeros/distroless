name: Update Grype Database
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
concurrency:
  group: update-grype-db
  cancel-in-progress: false
jobs:
  update:
    name: Update Grype vulnerability database
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          disk-cache: true
          # Restore only, like pr.yaml. This job exists to rewrite
          # MODULE.bazel.lock, and setup-bazel keys its caches on that
          # content — so every successful run would mint a *new* ~6 GB
          # repository entry rather than replace the old one. Two of those
          # exceed the repository's 10 GB Actions cache budget and evict
          # whatever ci.yaml warmed, which since the remote cache was
          # removed is the only cache there is.
          cache-save: false
          bazelrc: |
            common --config=ci
      # The published release, not a source build: knife pulls ~300 external
      # repos (anchore/syft, the AWS SDK, the LLVM toolchain), and
      # release-cli.yaml publishes one on every push to `main` that changes
      # it. `version` unset resolves the latest `knife/*` tag. Bazel above
      # stays: knife shells out to `bazel mod tidy` (bazel/mod/mod.go).
      - name: Install knife
        uses: ./.github/actions/setup-knife
      - name: Update Grype database
        uses: ./.github/actions/update-grype-db
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
