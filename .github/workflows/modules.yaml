---
# The Bazel modules under bazel/modules are workspaces of their own, consumed
# by the root through local_path_override and listed in .bazelignore, so
# `bazel test //...` at the root never reaches their tests. This runs each
# module's own suite, in its own workspace, as a check on pull requests and
# on main. No remote cache: the modules are small, and the root's cache
# configuration lives in the root .bazelrc, which these workspaces do not
# read.
name: Modules
on:
  pull_request:
    branches: [main]
    paths:
      - bazel/modules/**
      - .github/workflows/modules.yaml
  push:
    branches: [main]
    paths:
      - bazel/modules/**
      - .github/workflows/modules.yaml

jobs:
  # The matrix is the directory listing, so a module added under
  # bazel/modules is tested without anyone remembering to list it here. The
  # two places that still name each module, .bazelignore and the root's
  # local_path_override, fail the root build loudly when forgotten; this
  # one would have failed silently.
  discover:
    name: List modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List
        id: list
        run: |
          modules=$(find bazel/modules -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -c -s .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "$modules"

  test:
    name: Test ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        working-directory: bazel/modules/${{ matrix.module }}
        run: bazel test //...
