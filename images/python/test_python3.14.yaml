schemaVersion: 2.0.0
fileExistenceTests:
  - name: 'versioned interpreter'
    path: '/usr/bin/python3.14'
    shouldExist: true
commandTests:
  - name: 'python3 --version reports 3.14'
    command: '/usr/bin/python3'
    args: ['--version']
    expectedOutput: ['^Python 3\.14\.']
  - name: 'python3.14 is the same interpreter'
    command: '/usr/bin/python3.14'
    args: ['-c', 'import sys; print(sys.version_info[:2])']
    expectedOutput: ['^\(3, 14\)']
  - name: 'compression.zstd links libzstd'
    command: '/usr/bin/python3'
    args: ['-c', 'from compression import zstd; print(zstd.decompress(zstd.compress(b"ok")).decode())']
    expectedOutput: ['^ok']
