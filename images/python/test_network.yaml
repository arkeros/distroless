schemaVersion: 2.0.0
# Network-bound. A real TLS 1.3 handshake exercises the whole chain: the
# loader resolving _ssl -> libssl.so.3 -> libcrypto.so.3 from cc, glibc DNS
# resolution, and chain validation against the ca-certificates bundle
# SSL_CERT_FILE points at, which `create_default_context` reads.
commandTests:
  - name: 'TLS 1.3 handshake to en.wikipedia.org verifies via SSL_CERT_FILE'
    command: '/usr/bin/python3'
    args:
      - '-c'
      - |
        import socket, ssl
        ctx = ssl.create_default_context()
        with ctx.wrap_socket(socket.create_connection(("en.wikipedia.org", 443), timeout=30), server_hostname="en.wikipedia.org") as s:
            print(s.version(), s.getpeercert()["subject"][-1][0][1])
    expectedOutput: ['^TLSv1\.3 .*wikipedia\.org']
