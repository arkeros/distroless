name: Update RPM Packages
on:
  workflow_dispatch:
  schedule:
    # 30 min offset from the Debian cron so the two package-update PRs don't
    # land on top of each other.
    - cron: '30 16 * * *'
concurrency:
  group: update-rpm-packages
  cancel-in-progress: false
jobs:
  update:
    name: Update RPM packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: true
          external-cache: true
          # Restore only, like pr.yaml. This job exists to rewrite
          # MODULE.bazel.lock, and setup-bazel keys its caches on that
          # content — so every successful run would mint a *new* ~6 GB
          # repository entry rather than replace the old one. Two of those
          # exceed the repository's 10 GB Actions cache budget and evict
          # whatever ci.yaml warmed, which since the remote cache was
          # removed is the only cache there is.
          cache-save: false
          bazelrc: |
            common --config=ci
      - name: Update RPM packages
        uses: ./.github/actions/update-rpm-packages
        with:
          repos: >-
            hummingbird
            nginx_stable_rpm
            nginx_mainline_rpm
          token: ${{ secrets.RENOVATE_TOKEN }}
