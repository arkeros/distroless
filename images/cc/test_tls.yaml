schemaVersion: 2.0.0
# Network-bound. cc ships no executable of its own, so what it promises its
# consumers — a loadable TLS stack — is only observable from a consumer.
# The probe image (//images/cc:cc_tls_probe_amd64_debian) layers Debian's
# `openssl` CLI on the release image: one binary plus openssl.cnf, every
# library it loads comes from cc. A real handshake exercises the whole
# chain: the dynamic loader resolving libssl.so.3 -> libcrypto.so.3 ->
# libz.so.1 + libzstd.so.1 (openssl 3.6 links both for compression), glibc
# DNS resolution, and chain validation against the ca-certificates bundle
# SSL_CERT_FILE points at. A file-existence test cannot tell a present .so
# from a loadable one; a missing DT_NEEDED fails here with exit 127 before
# the first byte goes out.
commandTests:
  - name: 'TLS 1.3 handshake to en.wikipedia.org via SSL_CERT_FILE'
    command: '/usr/bin/openssl'
    args: ['s_client', '-connect', 'en.wikipedia.org:443', '-brief', '-verify_return_error']
    # -brief reports on stderr.
    expectedError:
      - 'CONNECTION ESTABLISHED'
      - 'Protocol version: TLSv1\.3'
      - 'Verification: OK'
    exitCode: 0
