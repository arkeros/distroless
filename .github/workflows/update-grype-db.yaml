name: Update Grype Database
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
concurrency:
  group: update-grype-db
  cancel-in-progress: false
jobs:
  update:
    name: Update Grype vulnerability database
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for the remote cache's workload identity federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Bazel's remote cache is a GCS bucket read through workload identity
      # federation; see //infra. Must precede setup-bazel's first invocation.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
          service_account: github-actions-cache@senku-prod.iam.gserviceaccount.com
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelrc: |
            common --config=ci
            common --config=gcs
      - name: Install knife
        uses: ./.github/actions/setup-knife
        with:
          target: //bazel/cmd/knife
      - name: Update Grype database
        uses: ./.github/actions/update-grype-db
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
