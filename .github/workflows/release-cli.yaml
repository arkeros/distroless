name: Release CLI tools
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release ${{ matrix.tool }}
    runs-on: ubuntu-latest
    # The cache-write identity below is bound to `attribute.environment/prod`,
    # whose branch policy names `main` (ADR 0014, infra/cache.tf). A
    # `workflow_dispatch` from any other branch never starts.
    environment: prod
    strategy:
      matrix:
        include:
          - tool: knife
            package: //bazel/cmd/knife
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Bazel's remote cache is a GCS bucket read through workload identity
      # federation; see //infra. Must precede setup-bazel's first invocation.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/874944788122/locations/global/workloadIdentityPools/github-distroless/providers/github-oidc
          service_account: github-actions-cache@senku-prod.iam.gserviceaccount.com
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Download cache only, not `external-cache`. knife pulls ~300
          # external repos (the anchore/syft stack, AWS SDK, the LLVM
          # toolchain), and the GCS cache cannot cover any of them — fetching
          # a repo is repository-rule work, not an action.
          #
          # Free to turn on everywhere: setup-bazel keys this on
          # platform + a hash of MODULE.bazel with no workflow or job
          # component, so all six workflows share one entry. `external-cache`
          # is the opposite — keyed per workflow/job, one entry per repo —
          # which is why only ci.yaml pays for that one.
          repository-cache: true
          bazelrc: |
            common --config=ci
            common --config=gcs
      # NOTE: When x_defs are added to go_binary targets for --version
      # stamping, add --stamp here and compare unstamped SHAs instead, or
      # drop change detection entirely and release on every push.
      - name: Build all platforms
        run: |
          bazel build --remote_download_outputs=toplevel ${{ matrix.package }}/...
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "$(bazel cquery --output=files "${{ matrix.package }}:${{ matrix.tool }}-${platform}")" "${{ matrix.tool }}-${platform}"
          done
      - name: Check if binaries changed
        id: check
        run: |
          TOOL="${{ matrix.tool }}"
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --json tagName --jq "[.[] | select(.tagName | startswith(\"${TOOL}/\"))][0].tagName // empty")

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found, releasing"
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Comparing against ${LATEST_TAG}"
          gh release download "$LATEST_TAG" --repo "${{ github.repository }}" --pattern "${TOOL}-*" --dir "/tmp/${TOOL}-latest"

          CHANGED=false
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            NEW_SHA=$(sha256sum "${TOOL}-${platform}" | cut -d' ' -f1)
            if [ -f "/tmp/${TOOL}-latest/${TOOL}-${platform}" ]; then
              OLD_SHA=$(sha256sum "/tmp/${TOOL}-latest/${TOOL}-${platform}" | cut -d' ' -f1)
            else
              OLD_SHA="none"
            fi
            if [ "$NEW_SHA" != "$OLD_SHA" ]; then
              echo "${platform}: changed (${OLD_SHA} -> ${NEW_SHA})"
              CHANGED=true
              break
            else
              echo "${platform}: unchanged (${NEW_SHA})"
            fi
          done

          if [ "$CHANGED" = "false" ]; then
            echo "All binaries unchanged, skipping release"
          fi
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest provenance
        if: steps.check.outputs.changed == 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.tool }}-*
      - name: Publish release
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION=$(./bazel/workspace_status.sh | grep STABLE_MONOREPO_SHORT_VERSION | cut -d' ' -f2)
          TAG="${{ matrix.tool }}/v${VERSION}"
          if [ -n "${{ steps.check.outputs.latest_tag }}" ]; then
            gh release create "$TAG" ${{ matrix.tool }}-* --title "${{ matrix.tool }} ${VERSION}" --generate-notes --notes-start-tag "${{ steps.check.outputs.latest_tag }}"
          else
            gh release create "$TAG" ${{ matrix.tool }}-* --title "${{ matrix.tool }} ${VERSION}" --notes "Initial release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check prebuilts pipeline
        id: prebuilts
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # `bazel run` downloads the binary even with
          # --remote_download_outputs=minimal; `bazel cquery --output=files`
          # would only return a path that may not be materialised.
          if bazel run --ui_event_filters=-info,-stdout,-stderr //bazel/cmd/knife -- prebuilts list | grep -qx "${{ matrix.tool }}"; then
            echo "has_pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.tool }} is not configured for versions.bzl refresh; skipping"
            echo "has_pipeline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate versions.bzl
        if: steps.prebuilts.outputs.has_pipeline == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bazel run //bazel/cmd/knife -- prebuilts update --tool "${{ matrix.tool }}"
      - name: Show pending diff
        id: diff
        if: steps.prebuilts.outputs.has_pipeline == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "versions.bzl already up-to-date"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push versions.bzl
        if: steps.diff.outputs.has_changes == 'true'
        # Pushes authenticated with GITHUB_TOKEN don't re-trigger workflows,
        # which is what avoids this step causing an infinite release loop.
        # If you ever swap GITHUB_TOKEN for a PAT here, re-evaluate.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(${{ matrix.tool }}): refresh versions.bzl"
          # Race-safe push: if main advanced while we ran (another matrix
          # job committing, or an unrelated push), rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * attempt))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
