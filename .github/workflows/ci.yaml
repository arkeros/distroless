---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    name: Publish mirror images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for cosign keyless OIDC (Fulcio + Rekor)
      packages: write   # for GHCR push + cosign sig/attest artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          bazelisk-cache: true
          repository-cache: true
          external-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          bazelrc: |
            common --config=ci
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --stamp

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Load consumer-side cosign policy (regex + issuer) from the same
      # Starlark source that mirror_push uses for the predicate's BUILDER_ID.
      # See //oci:cosign_policy.bzl. Renames to the workflow file or branch
      # only need to be done in that one Starlark file.
      - name: Load cosign policy
        run: |
          set -euxo pipefail
          bazel build //oci:cosign_policy_env
          cat "$(bazel cquery //oci:cosign_policy_env --output=files)" >> "$GITHUB_ENV"

      # Fetch the Sigstore trusted root once, up front, and hand it to every
      # verify below via --trusted-root. Without it each cosign invocation
      # re-refreshes TUF metadata from tuf-repo-cdn.sigstore.dev, so a single
      # CDN hiccup somewhere in a few dozen verifies fails the whole job on
      # signatures that are perfectly good — see run 31056638456, which died on
      # a 503 for 16.root.json. `trusted-root create --with-default-services`
      # goes through the same TUF client and the same signature checks the
      # verifies would have done individually; this is one fetch, not a weaker
      # one. That leaves exactly one network call to protect, so retry it.
      - name: Fetch Sigstore trusted root
        run: |
          set -euo pipefail
          # cquery only analyses — it prints a path without producing the file,
          # and --remote_download_outputs=minimal keeps build outputs remote.
          # Build the binary and pull it down explicitly rather than relying on
          # a later `bazel run` to materialise it as a side effect.
          bazel build --remote_download_outputs=all \
              //bazel/toolchains/cosign:compiled_cosign_toolchain
          COSIGN=$(realpath "$(bazel cquery //bazel/toolchains/cosign:compiled_cosign_toolchain --output=files)")
          echo "COSIGN=${COSIGN}" >> "$GITHUB_ENV"
          TRUSTED_ROOT="${RUNNER_TEMP}/trusted_root.json"
          for attempt in 1 2 3 4 5; do
            if "${COSIGN}" trusted-root create \
                --with-default-services \
                --out "${TRUSTED_ROOT}"; then
              echo "TRUSTED_ROOT=${TRUSTED_ROOT}" >> "$GITHUB_ENV"
              exit 0
            fi
            delay=$((attempt * 15))
            echo "trusted-root create failed (see cosign's error above); retrying in ${delay}s (attempt ${attempt}/5)" >&2
            sleep "${delay}"
          done
          echo "ERROR: could not create the Sigstore trusted root after 5 attempts." >&2
          exit 1

      # Bazel-native cosign signing per ADR 0006. `mirror_push` macros emit
      # <name>_push, <name>_sign, <name>_attest, optional <name>_attest_sbom.
      # Discover via `cosign_sign rule` since that's unambiguous: every mirror
      # image has exactly one. The matching push/attest targets follow naming.
      # We collect (BASE, registry, repository, digest) tuples for the
      # post-publish positive verify step.
      - name: Push, sign, and attest mirror images
        id: publish
        run: |
          set -euxo pipefail
          SIGN_TARGETS=$(bazel query 'kind("cosign_sign rule", //...)' --output=label)
          PUBLISHED=""
          for SIGN_TARGET in $SIGN_TARGETS; do
            BASE=${SIGN_TARGET%_sign}
            echo "::group::${BASE}"
            bazel run "${BASE}_push"
            bazel run "${BASE}_sign"
            bazel run "${BASE}_attest"
            HAS_SBOM=0
            if bazel query "${BASE}_attest_sbom" 2>/dev/null | grep -q .; then
              bazel run "${BASE}_attest_sbom"
              HAS_SBOM=1
            fi

            # Capture the just-pushed digest for the positive verify step.
            bazel build --output_groups=deploy_manifest --remote_download_outputs=all "${BASE}_push"
            MANIFEST=$(bazel cquery "${BASE}_push" --output=files --output_groups=deploy_manifest)
            REGISTRY=$(jq -r '.operations[0].registry' "$MANIFEST")
            REPOSITORY=$(jq -r '.operations[0].repository' "$MANIFEST")
            DIGEST=$(jq -r '.operations[0].root.digest' "$MANIFEST")
            PUBLISHED+="${REGISTRY}/${REPOSITORY}@${DIGEST} ${HAS_SBOM}"$'\n'
            echo "::endgroup::"
          done
          # Persist for the next step. EOF-delimited heredoc handles newlines.
          {
            echo 'PUBLISHED<<EOF'
            printf '%s' "$PUBLISHED"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # Positive test: every just-published image must verify under the
      # production policy with both predicate types. Catches mis-attested
      # predicates, wrong type strings, Rekor-upload misconfig, and OIDC
      # subject drift between producer (BUILDER_ID) and consumer (regex).
      - name: Verify just-published images (positive test)
        run: |
          set -euo pipefail
          while IFS=' ' read -r REF HAS_SBOM; do
            [[ -z "$REF" ]] && continue
            echo "::group::verify ${REF}"
            "${COSIGN}" verify-attestation \
                --trusted-root="${TRUSTED_ROOT}" \
                --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                --type=slsaprovenance \
                "${REF}" > /dev/null
            if [[ "${HAS_SBOM}" == "1" ]]; then
              "${COSIGN}" verify-attestation \
                  --trusted-root="${TRUSTED_ROOT}" \
                  --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
                  --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
                  --type=cyclonedx \
                  "${REF}" > /dev/null
            fi
            echo "OK: ${REF}"
            echo "::endgroup::"
          done <<< "${PUBLISHED}"

      # Negative test: production verify policy must REJECT a real-but-wrong-
      # identity image (Google's distroless, signed by their workflow). If a
      # future PR widens the verify regex, this assertion starts failing-when-
      # it-should-fail and CI catches it. Per ADR 0006.
      - name: Verify policy is strict (negative test)
        run: |
          set -euo pipefail
          STDERR=$(mktemp)
          # Negative case: rejects a correctly-signed-but-wrong-identity image.
          if "${COSIGN}" verify-attestation \
              --trusted-root="${TRUSTED_ROOT}" \
              --certificate-identity-regexp="${COSIGN_POLICY_CERTIFICATE_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer="${COSIGN_POLICY_CERTIFICATE_OIDC_ISSUER}" \
              --type=slsaprovenance \
              gcr.io/distroless/static-debian12:nonroot 2> "${STDERR}"; then
            echo "ERROR: verify policy is too permissive — accepted gcr.io/distroless/static-debian12:nonroot, which was signed by Google's distroless workflow, not ours." >&2
            echo "--- cosign stderr ---" >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          # cosign failing is not on its own evidence of a strict policy — a
          # Sigstore CDN outage fails the same way. Require the rejection to be
          # the identity mismatch we are actually asserting, so infrastructure
          # trouble surfaces as a failure instead of a vacuous pass.
          if ! grep -q "none of the expected identities matched" "${STDERR}"; then
            echo "ERROR: cosign rejected the reference, but not because the identity mismatched — this assertion proves nothing about the policy." >&2
            echo "--- cosign stderr ---" >&2
            cat "${STDERR}" >&2
            exit 1
          fi
          echo "OK: verify policy correctly rejects the signed-by-Google reference."
          echo "--- cosign rejection reason (for the record) ---"
          cat "${STDERR}"

  # ---------------------------------------------------------------------------
  # Cloud Run deploy.
  #
  # The service is described by the Knative manifest at
  # //oci/cmd/registry:service.yaml and applied with `gcloud run services
  # replace`, once per region. The manifest is the desired state; this job only
  # supplies the image and the region.
  #
  # Terraform is not in this path. `//infra` owns the durable substrate (the
  # Artifact Registry repo and the runtime GSA) and is applied out of band —
  # it changes on the order of never, whereas this deploys every push to main.
  # ---------------------------------------------------------------------------

  deploy:
    name: Deploy registry
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # `prod` is configured in repo settings with `main`-only deployment
    # branches and required reviewers. GitHub validates both *before* minting
    # the OIDC token, so the branch/reviewer gate lives in the identity layer —
    # not in this YAML, which any committer can edit. The deploy SA's WIF
    # binding is keyed on `attribute.environment/prod`, so a token from any
    # other environment cannot impersonate it.
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      # Regions are independent replicas of one workload. Deploy them one at a
      # time so a bad image stops at the first region instead of all three.
      max-parallel: 1
      matrix:
        region: [us-central1, europe-west3, asia-northeast1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          bazelrc: |
            common --config=ci
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            build --stamp

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/874944788122/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-actions-senku-apply@senku-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Pushing on every region is a no-op after the first: same digest, same
      # tags. Kept in the matrix rather than hoisted so a re-run of one region
      # is self-contained.
      - name: Push image to Artifact Registry
        run: bazel run //oci/cmd/registry:image_push_gar

      # Resolve the tag we just pushed to its digest, and deploy *that*. The
      # manifest never carries a mutable tag: two regions deploying an hour
      # apart must land the same bytes, and `latest` cannot promise that.
      - name: Resolve pushed digest
        run: |
          set -euo pipefail
          REPO="europe-docker.pkg.dev/senku-prod/containers/registry"
          DIGEST=$(gcloud artifacts docker images describe "${REPO}:latest" \
              --format='value(image_summary.digest)')
          echo "IMAGE=${REPO}@${DIGEST}" >> "$GITHUB_ENV"
          echo "Deploying ${REPO}@${DIGEST}"

      - name: Deploy to Cloud Run (${{ matrix.region }})
        run: |
          set -euo pipefail
          MANIFEST=$(mktemp --suffix=.yaml)
          # The placeholder is a fixed token, so a literal substitution is
          # enough — no YAML templating engine in the deploy path.
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" \
              oci/cmd/registry/service.yaml > "${MANIFEST}"
          gcloud run services replace "${MANIFEST}" --region="${{ matrix.region }}"

      # Not expressible in the Knative manifest: `run.invoker` for `allUsers`
      # is an IAM policy on the service, not part of its spec. The LB's
      # Serverless NEG calls without injecting an OIDC identity, so the service
      # must accept anonymous invokes; the ingress annotation in the manifest
      # is what keeps it off the open internet. Idempotent.
      - name: Allow unauthenticated invokes (LB fronts this)
        run: |
          gcloud run services add-iam-policy-binding registry \
              --region="${{ matrix.region }}" \
              --member=allUsers \
              --role=roles/run.invoker
