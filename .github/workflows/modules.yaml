---
# The Bazel modules under bazel/modules are workspaces of their own, consumed
# by the root through local_path_override and listed in .bazelignore, so
# `bazel test //...` at the root never reaches their tests. This runs each
# module's own suite, in its own workspace, as a check on pull requests and
# on main. No remote cache: the modules are small, and the root's cache
# configuration lives in the root .bazelrc, which these workspaces do not
# read.
#
# On pull requests this runs unconditionally, with no path filter: the
# `Modules` job below is a required check in the `main-checks` ruleset
# (infra/repo.tf), and a required check that does not run leaves the pull
# request waiting for it forever. On main the filter stays; nothing gates
# there, and the run only warms the cache.
name: Modules
on:
  # Any base, as pr.yaml: stacked pull requests are tested where they sit.
  pull_request:
  push:
    branches: [main]
    paths:
      - bazel/modules/**
      - .github/workflows/modules.yaml

jobs:
  # The matrix is the directory listing, so a module added under
  # bazel/modules is tested without anyone remembering to list it here. The
  # two places that still name each module, .bazelignore and the root's
  # local_path_override, fail the root build loudly when forgotten; this
  # one would have failed silently.
  discover:
    name: List modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List
        id: list
        run: |
          modules=$(find bazel/modules -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -c -s .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "$modules"

  test:
    name: Test ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: v1.27.0
          # One cache per module, not one for the matrix. Every leg runs on its
          # own runner with its own ~/.cache/bazel-disk holding only its
          # module's actions, so under a shared key they all save to it, GitHub
          # accepts the first and 409s the rest, and one arbitrary module's
          # cache is what gets stored. Worse, the next run is an *exact* key
          # hit for every leg, which suppresses the save (post.js), so the
          # cache stays frozen on that one module until a BUILD file moves the
          # hash. The other legs download it and get nothing.
          disk-cache: modules-${{ matrix.module }}
          # And scope the key's hash to the module. `module-root` feeds only
          # the `files:` globs (config.js:154) — MODULE.bazel and **/BUILD* —
          # so at its `.` default every module's key rotates on any root BUILD
          # change, which is most commits here. These workspaces are reached
          # through local_path_override and their outputs do not depend on the
          # root, so the root has no business invalidating them.
          module-root: bazel/modules/${{ matrix.module }}
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        working-directory: bazel/modules/${{ matrix.module }}
        run: bazel test //...

  # One check with a fixed name for the ruleset to require, fanned in from
  # the matrix, so the required-checks list in infra/repo.tf does not have
  # to name each module: that list would be the third place a module's name
  # lives, and the one that fails silently. Runs even when a leg failed or
  # was cancelled, and fails then; `needs` alone would skip it, and a skipped
  # required check reads as passing to the ruleset.
  modules:
    name: Modules
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every module passed
        run: |
          [ "${{ needs.test.result }}" = "success" ]
