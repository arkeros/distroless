name: Update Debian Packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
concurrency:
  group: update-debian-packages
  cancel-in-progress: false
jobs:
  update:
    name: Update Debian packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Bazelisk
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: true
          external-cache: true
          cache-save: true
          bazelrc: |
            common --config=ci
      - name: Install knife
        uses: ./.github/actions/setup-knife
        with:
          target: //bazel/cmd/knife
      - name: Update Debian packages
        uses: ./.github/actions/update-debian-packages
        with:
          manifests: >-
            images/debian.yaml
            images/nginx/nginx-stable.yaml
            images/nginx/nginx-mainline.yaml
          token: ${{ secrets.RENOVATE_TOKEN }}
